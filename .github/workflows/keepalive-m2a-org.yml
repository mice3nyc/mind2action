# Supabase 무료 플랜은 쓰임이 뜸하면 프로젝트를 일시정지한다(2026-10-27 m2a-org 정지, 11/4 복구).
# 주 2회 DB를 한 번 읽어 깨어 있게 한다. 실패하면 GitHub가 저장소 주인에게 메일을 보낸다.
name: Keep m2a-org awake

on:
  schedule:
    - cron: '17 21 * * 0,3' # 월·목 06:17 KST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: https://qklojqehzcazbwlaovty.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.M2A_ORG_SUPABASE_ANON_KEY }}
        run: |
          # 공개 저장소라 로그에 응답 본문을 남기지 않는다
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 30 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/campaigns?select=*&limit=1")
          echo "HTTP $code"
          test "$code" = 200

      # 공개 저장소의 예약 실행은 저장소 활동이 60일 없으면 꺼진다. 다시 켜서 그 기한을 미룬다.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keepalive-m2a-org.yml/enable"
