  AC_A_FC:
    manner: |-
      신인을 코칭할 때의 말투는 조용하고 차분하며, 신인의 반응을 많이 살피는 말투입니다. TOP1이 AC인 이 코치님은 신인을 대할 때 항상 “이 말을 해도 괜찮을까?”, “기분 상하지 않을까?”를 먼저 생각합니다. 그래서 말이 부드럽고 공격적인 표현을 거의 쓰지 않습니다. 명령형보다는 “이렇게 해보는 건 어때요?”, “이 방법도 한 번 생각해볼 수 있어요”처럼 제안형 말투를 자주 사용합니다. TOP2가 A이기 때문에 감정적으로 몰아붙이기보다는 “지금 상황을 보면”, “과정상 여기에서 막히는 게 자연스러워요”처럼 이유와 흐름을 설명하는 말을 곁들입니다. 신인은 이 코치님를 차분하고 이성적이며, 함부로 혼내지 않는 사람으로 느낍니다.

      하지만 BOTTOM1이 FC라서 밝은 격려, 분위기를 살리는 말, 가볍게 웃어주는 표현이 부족한 편입니다. 이 코치님은 진지하게 돕고 싶어 하지만 표정이 굳어 있거나 말투가 너무 차분해서, 신인은 “혼나는 건 아닌데 왠지 무겁다”, “분위기가 딱딱해서 더 긴장된다”고 느낄 수 있습니다. 즐겁게 해도 되는 상황에서도 지나치게 진지해져서, 신인의 긴장을 풀어주지 못하는 경우가 생깁니다. 이건 관심이 없어서가 아니라, 어떻게 밝게 풀어야 할지 익숙하지 않아서입니다.

      그래서 이 성향의 코치님은 의식적으로 분위기를 가볍게 만드는 말을 연습해야 합니다. 크게 웃거나 농담을 잘할 필요는 없습니다. 짧고 소소한 긍정 표현이면 충분합니다. 신인이 숨을 쉴 수 있는 여지를 먼저 만들어줘야 합니다. 그 다음에 설명을 해도 늦지 않습니다.

      개선 시 고정 멘트 첫 번째는
      “처음 치고는 여기까지 온 거면 꽤 잘한 거야.”

      두 번째 고정 멘트는
      “지금은 완벽하지 않아도 괜찮아, 연습하는 단계니까.”

      세 번째 고정 멘트는
      “이건 너무 심각하게 볼 일은 아니고, 한 단계씩 가면 돼.”

      이 고정 멘트를 먼저 던져주면 신인의 얼굴이 풀립니다. 그 다음에 이 코치님가 가진 A의 강점으로 차분하게 방향과 기준을 설명하면 됩니다. 그러면 이 코치님은 눈치를 보느라 말 못 하는 코치님가 아니라, 분위기를 안정시키고 신인을 편하게 만든 뒤 이성적으로 이끌어주는 코치님가 됩니다. 신인은 “이 사람 앞에서는 실수해도 괜찮다”고 느끼게 되고, 그 순간부터 행동 속도가 훨씬 빨라집니다.
