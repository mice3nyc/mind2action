    manner: "OOO님은 조직 안에서 사람을 안정적으로 챙기고 신인의 감정 흐름을 세밀하게 살피려는 힘이 강한 성향입니다.\n\n NP(배려,공감)의 점수가 높기 때문에 신인이 힘들어하면 먼저 이유를 들으려 하고 쉽게 포기하지 않도록 옆에서 계속 챙겨주려는 모습이 강하게 나타납니다. \n\n그리고 두 번째로 A(이성,판단)가 높기 때문에 단순히 감정적으로만 조직을 운영하는 것이 아니라 현실적인 흐름과 숫자도 같이 보려고 합니다. 신인의 활동량, 고객 흐름, 상담 진행 상황 등을 비교적 객관적으로 보며 문제 원인을 차분하게 정리하려는 모습도 나타납니다. \n\n다만 FC(친화,표현)의 점수가 가장 낮으면 조직 안에서 분위기를 부드럽게 풀어주는 표현은 부족해질 수 있습니다. 코치 본인은 충분히 배려하고 차분하게 이야기하고 있다고 느끼지만 신인 입장에서는\n“조금 어렵게 느껴진다.”\n“칭찬과 반응 표현이 부족하다.”\n“긴장감이 오래 유지된다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직의 안정감과 논리적 분석의 힘은 매우 좋지만 신인이 심리적으로 즐겁게 움직일 수 있는 분위기를 만드는 부분은 부족해질 수 있는 구조입니다. 그래서 신인의 활동을 독려하기 위해서 칭찬과 인정의 멘트를 하는 습관이 중요합니다.\n\n특히 OOO님은\n“고생 많으셨습니다.”\n“지금 계속 움직이고 계신 부분이 정말 좋습니다.”\n“오늘 분위기 좋게 잘 버텨주셨습니다.”\n같은 짧은 인정 표현을 의식적으로 자주 사용하는 것이 필요합니다.\n\n또한 FC(친화,표현)가 낮은 코치는 표정과 반응이 차분하게 유지되는 경우가 많기 때문에 신인은 자신이 혼나고 있다고 오해할 수도 있습니다. 그래서 의식적으로 미소를 띄고 고개를 끄덕이며 들어주는 반응을 추가하는 것만으로도 조직 분위기가 훨씬 편안해질 수 있습니다.\n\nOOO님의 성향은 원래 조직의 분위기와 유지력을 매우 좋게 만드는 성향입니다. 여기에 밝은 반응과 편안한 분위기가 더해지면 신인의 활동량과 생산성 흐름도 안정적으로 올라가게 됩니다."
