  A_CP_FC:
    manner: |-
      신인을 코칭할 때의 말투는 차분하고 이성적인 설명형 말투입니다. TOP1이 A이기 때문에 이 코치님은 감정에 휘둘리지 않고 상황을 정리해서 말합니다. “어디에서 막혔는지”, “왜 이 결과가 나왔는지”, “다음에는 무엇을 바꿔야 하는지”를 순서대로 설명합니다. 여기에 TOP2가 CP라서 말이 분명하고 기준이 뚜렷합니다. “이건 반드시 지켜야 해”, “이 단계는 건너뛰면 안 돼”처럼 방향을 명확히 제시합니다. 이 말투 덕분에 신인은 해야 할 일이 정리되어 보이고, 기준이 분명하다는 안정감을 느낍니다.

      하지만 BOTTOM1이 FC라서 밝은 반응이나 감정 표현이 적은 편입니다. 잘했을 때도 “그래, 다음 단계로 가자”라고 넘어가고, 힘들어할 때도 분위기를 풀어주는 말이 잘 나오지 않습니다. 그래서 신인은 “맞는 말이긴 한데 좀 딱딱하다”, “열심히 했는데 반응이 없는 것 같다”고 느낄 수 있습니다. 특히 처음 일을 배우는 신인에게는 이 코칭이 차갑게 느껴질 가능성이 있습니다.

      이 성향의 코치님은 의식적으로 감정 반응을 한 박자 더 얹는 연습이 필요합니다. 분석과 지적 전에 짧은 긍정 표현만 추가해도 코칭의 온도가 달라집니다.
      첫 번째 고정 멘트는
      “여기까지 해낸 건 분명 잘한 거야.”
      성과의 크기와 상관없이 노력을 인정해 주는 말입니다.

      두 번째 고정 멘트는
      “이 부분은 조금 더 연습하면 충분히 좋아질 수 있어.”
      부족함을 말하면서도 희망을 함께 주는 문장입니다.

      세 번째 고정 멘트는
      “지금처럼만 꾸준히 가면 분명 달라질 거야.”
      과정 자체를 믿어주는 말입니다.

      이 고정 멘트를 반복하면, 이 성향의 코치님은 차분하지만 따뜻한 코치님로 인식됩니다. 신인은 지적만 받는 느낌이 아니라, 잘한 점과 보완할 점을 함께 듣게 되고 코칭 시간이 부담이 아닌 힘을 얻는 시간이 됩니다.
