      이 성향은 원래 조직 분위기와 사람의 에너지를 살리는 힘이 매우 뛰어난 성향입니다. 여기에 실행 움직임을 조금 더 끌어주는 힘이 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
