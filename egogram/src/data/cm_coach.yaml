      이 고정 멘트를 쓰면 신인은 가볍게 넘겨지는 사람이 아니라, 존중받고 있다고 느끼게 됩니다. 그러면 이 코치님은 단순히 재미있는 코치님를 넘어서, 편안하면서도 믿을 수 있는 코치님가 됩니다. 신인은 마음을 숨기지 않게 되고, 코칭의 깊이가 자연스럽게 깊어집니다.
