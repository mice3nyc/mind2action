      그래서 이 성향의 코치님은 공감의 말을 의식적으로 먼저 꺼내는 연습이 필요합니다. 길게 위로할 필요는 없습니다. 짧아도 괜찮지만, 순서는 꼭 지켜야 합니다. 설명보다 공감이 먼저입니다. 그래야 신인은 마음을 닫지 않고 말을 듣게 됩니다.

      개선 시 고정 멘트 첫 번째는
      “일단 여기까지 온 것 자체가 쉬운 건 아니야.”

      두 번째 고정 멘트는
      “이 부분에서 막히는 건 누구나 한 번쯤 겪는 거야.”

      세 번째 고정 멘트는
      “힘들었을 텐데도 계속 해보려는 건 분명 장점이야.”

      이 고정 멘트를 먼저 말한 뒤에, 그 다음에 구조와 방법을 설명하면 됩니다. 그러면 이 코치님은 눈치를 보느라 말 못 하는 코치님가 아니라, 공감으로 문을 열고 이성으로 방향을 잡아주는 코치님가 됩니다. 신인은 “이 사람은 나를 이해하면서도 기준을 잃지 않는구나”라고 느끼게 되고, 코칭에 대한 신뢰도 훨씬 높아집니다.
