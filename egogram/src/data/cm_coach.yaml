  A_CP_NP:
    manner: "OOO님은 조직 안에서 흐름을 차분하게 정리하고 현실적으로 움직임을 관리하려는 힘이 강한 성향입니다.\n\nA(이성,판단)의 점수가 높기 때문에 현재 상황을 객관적으로 보려고 합니다. 신인의 활동량, 고객 흐름, 상담 진행 상황, 계약 움직임 등을 비교적 냉정하게 확인하며 문제 원인을 빠르게 정리하려는 모습이 강하게 나타납니다. \n\n그리고 두 번째로 CP(기준,결단)가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. 필요할 때는 분명하게 방향을 정리하고 움직임이 흐트러질 때는 다시 중심을 잡아주려는 힘도 있습니다. \n\n다만 NP(배려,공감)의 점수가 가장 낮으면 신인의 감정 상태를 따뜻하게 공감하거나 오래 들어주는 부분은 부족해질 수 있습니다. 코치 본인은 충분히 설명하고 방향도 잘 잡아주고 있다고 느끼지만 신인 입장에서는\n“조금 차갑게 느껴질 때가 있다.”\n“내 마음까지 충분히 이해받는 느낌은 아니다.”\n“결론이 빨리 나온다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 논리적 분석의 힘과 조직의 실행력을 안정적으로 끌고 가는 힘은 매우 좋지만 신인의 감정과 심리 상태를 충분히 공감해주는 부분은 부족해질 수 있는 구조입니다. 그래서 신인의 감정 상태와 부담 정도를 먼저 확인하는 습관이 중요합니다.\n\n특히 OOO님은 “지금 왜 안 되고 있을까요?”라고 바로 원인을 정리하기보다\n“요즘 가장 버겁게 느껴지는 부분은 어떤 건가요?”\n“최근에 가장 지쳤던 순간은 언제였나요?”\n같은 질문을 먼저 넣어주는 것이 필요합니다.\n\nOOO님의 성향은 실행 움직임을 끌어가는 힘이 좋기 때문에 공감 이후에는 반드시 실제 행동으로 연결해주는 흐름이 필요합니다. 예를 들어\n“그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”\n처럼 현실적인 움직임으로 연결해주는 표현이 함께 들어가야 신인의 성장이 살아나게 됩니다.\n\nOOO님의 성향은 원래 조직의 원칙과 기준 그리고 생산성을 안정적으로 유지하는 힘이 매우 뛰어난 성향입니다. 여기에 따뜻한 공감과 감정 확인이 조금 더해지면 신인의 활동량과 생산성 흐름도 훨씬 안정적으로 올라가게 됩니다."
    improvement: ''
