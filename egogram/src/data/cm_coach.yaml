cm4_3:
  all_no_coaching: |-
    다섯 가지 에너지가 한쪽으로 치우치지 않고 상황에 맞게 안정적으로 쓰이고 있습니다. 필요할 때는 기준과 결단을 보여 주고, 또 필요할 때는 사람의 마음을 세심하게 살필 줄 압니다. 흔들리지 않으면서도 차갑지 않은 균형을 이미 습관처럼 사용하고 있는 단계입니다. 이것은 타고난 기질이라기보다 경험을 통해 만들어진 프로의 힘입니다.

    이 위치에 있는 코치는 크게 바꿔야 할 대상이 아닙니다. 이미 만들어진 좋은 상태를 얼마나 꾸준히 유지하느냐가 더 중요합니다. 그래서 앞으로의 핵심 과제는 변화보다 지속성입니다. 컨디션이 좋을 때의 나를 기준으로 삼고, 흔들릴 때 다시 그 자리로 돌아오는 힘을 키우는 것입니다.

    주변은 이미 코치을 신뢰합니다. 이제는 개인 성과를 넘어 영향을 주는 단계에 들어와 있습니다.

    지금 잘하고 있는 방식을 계속 반복하면 됩니다. 그러면 실력은 우연이 아니라 구조가 되고, 결과는 기복이 아니라 흐름이 됩니다.
    지금처럼만 유지해도 충분히 훌륭합니다. 그리고 그 안정감을 오래 이어 간다면 더 큰 자리에서도 자연스럽게 인정받게 될 것입니다.
  some_coaching: ''
cm4_4:
  CP:
    condition: 0-7
    trait: (우유부단, 결정회피,관용적, 주장성부족)
    coaching: |-
      이 성향은 사람을 존중하며 조심스럽게 접근하는 태도가 매우 좋습니다. 신인이 부담을 느끼지 않도록 기다려 주고 들어주는 힘이 크기 때문에 함께 일하면 편안함을 느끼게 됩니다. 이 관계 형성 능력은 큰 자산입니다.

      다만 방향을 잡아줘야 할 순간에도 배려가 앞서면 신인은 무엇을 먼저 해야 할지 헷갈릴 수 있습니다. 선택을 열어 둔 채 마무리되면 실행이 늦어지고, 시간이 지나도 변화가 적어 답답함이 반복될 수 있습니다. 따뜻함에 기준과 결론을 조금만 더 얹으면 코칭의 속도가 훨씬 빨라집니다.
    script: |-
      “이 부분은 꼭 해주셔야 합니다.”

      “우선 해보시고, 이후에 조정하겠습니다.”

      “제가 책임질 테니 그대로 해보시죠.”
  NP:
    condition: 0-7
    trait: (공감부족,정서둔감,관계의거리감,차가움)
    coaching: |-
      이 성향은 감정에 휘둘리지 않고 일의 핵심을 보려는 힘이 좋습니다. 상황을 냉정하게 바라보고 해결 방향을 찾으려 하기 때문에 기준이 분명하고 효율적인 코칭이 가능합니다. 이런 태도 덕분에 원칙과 결과 중심의 리드는 분명한 강점입니다.

      하지만 따뜻한 표현이 적으면 신인은 도움을 받고 있으면서도 정서적으로는 혼자라고 느낄 수 있습니다. 설명은 이해했지만 마음이 움직이지 않아 실행이 늦어지는 모습이 생길 수 있습니다. 공감을 잘하라는 뜻이 아니라, 이해받고 있다는 신호를 먼저 주는 한마디가 추가되면 코칭의 흡수력이 훨씬 높아집니다.
    script: |-
      “많이 부담되셨을 것 같습니다.”

      “충분히 그렇게 느끼실 수 있습니다.”

      “그래도 여기까지 해내신 건 정말 잘하신 겁니다.”
  A:
    condition: 0-7
    trait: (비논리,감정적,판단혼란,즉흥성)
    coaching: |-
      이 성향은 사람의 마음을 먼저 읽고 관계를 부드럽게 만들 줄 아는 따뜻함이 있습니다. 신인의 긴장을 풀어 주고 분위기를 편안하게 만드는 힘이 좋기 때문에 처음 만나는 사람도 마음의 문을 빨리 엽니다. 이 점은 코치로서 아주 소중한 장점입니다.

      다만 기준과 판단의 언어가 부족해지면 신인은 “그래서 어떻게 해야 하지?”라는 상태에 머물 수 있습니다. 방향이 명확하지 않으면 실행력이 떨어지고 성장 속도가 늦어질 수 있습니다. 공감 뒤에 정리된 결론 한 문장이 더해지면 코칭의 힘이 훨씬 강해집니다.
    script: |-
