    이 성향은 기준을 세우는 힘이 강합니다. 무엇이 맞고 무엇이 중요한지 분명하게 말해 줄 수 있습니다. 그래서 후보자는 복잡했던 생각이 정리되고, 길이 보이는 느낌을 받습니다. 또한 사람을 생각하는 따뜻함이 함께 있기 때문에 엄격함보다는 보호받는 안정감으로 전달됩니다.
