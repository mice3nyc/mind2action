    다만 신경 써야 할 부분도 있습니다. 눈치를 덜 보고 자기 기준대로 말하는 편이라, 본인은 솔직하다고 생각해도 상대에게는 갑작스럽게 들릴 수 있습니다. 특히 설명하거나 방향을 제시할 때 조금만 강해지면 배려가 줄어든 느낌을 줄 수 있습니다.

