    manner: "OOO님은 조직 안에서 흐름을 안정적으로 유지하고 신인을 책임감 있게 관리하려는 힘이 강한 성향입니다.\n\nCP(기준,결단)의 점수가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. \n\n그리고 두 번째로  AC(협조,조율)가 높기 때문에 조직 안의 분위기와 신인의 상황을 많이 살피는 편입니다. 신인이 부담을 느끼지 않도록 조심하려 하고, 조직 안에서 충돌이 커지지 않도록 흐름을 조율하려는 모습도 나타납니다. \n\n다만 FC(친화,표현)의 점수가 가장 낮으면 조직 안에서 분위기를 부드럽게 풀어주는 표현이 부족해질 수 있습니다. 코치 본인은 충분히 배려하면서 이야기하고 있다고 느끼지만 신인 입장에서는\n“조금 어렵게 느껴진다.”\n“가까이 다가가기 쉽지 않다.”\n“긴장감이 오래 유지된다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직을 안정적으로 유지하고 흐름을 관리하는 힘은 좋지만 신인이 심리적으로 즐겁게 움직일 수 있도록 분위기를 풀어주는 부분은 부족해질 수 있는 구조입니다. \n\n그래서 신인을 독려하기 위해서\n“요즘 너무 잘 하시고 계세요^^”\n“수고 많았어요 이 부분은  제가 높게 평가합니다.”\n“결과도 중요하지만 지금 과정도 아주 잘하고 있습니다.”\n같은 멘트를 먼저 넣어주는 것이 필요합니다. \n\n또한 FC(친화,표현)가 낮은 코치는 표정과 반응이 차분하게 유지되는 경우가 많기 때문에 신인은 자신이 혼나고 있다고 오해할 수도 있습니다. 그래서 의식적으로 미소를 띄고 고개를 끄덕이며 들어주는 반응을 추가하는 것만으로도 조직 분위기가 훨씬 편안해질 수 있습니다.\n\nOOO님의 성향은 원래 조직을 오래 안정적으로 유지할 수 있는 힘이 매우 좋은 성향입니다. 여기에 신인이 심리적으로 편하게 움직일 수 있는 분위기와 따뜻한 반응이 더해지면 신인의 활동량과 생산성, 매출 흐름이 훨씬 안정적으로 올라가게 됩니다."
