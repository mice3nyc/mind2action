      두 번째 고정 멘트는
      “느낌은 괜찮은데, 정리하면 이렇게 하면 더 좋아.”

      세 번째 고정 멘트는
      “지금 단계에서는 이 한 가지만 기억하면 돼.”

      이 고정 멘트를 쓰면 신인은 편안함 속에서도 방향을 잃지 않게 됩니다. 그러면 이 코치님은 재미있는 코치님를 넘어서, 편안하면서도 믿고 따라갈 수 있는 코치님가 됩니다. 신인은 무엇을 왜 해야 하는지 이해하게 되고, 코칭의 속도와 안정감이 함께 올라가게 됩니다.
