  CP_A_NP:
    manner: "OOO님은 조직 안에서 방향을 잡고 흐름을 정리하는 힘이 매우 강한 성향입니다.\n\nCP(기준,결단)의 점수가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. \n\n그리고 두 번째로 A(이성,판단)가 높기 때문에 감정적으로 흔들리기보다 상황을 정리하고 분석하려는 힘이 강합니다. 신인의 활동량, 상담 흐름, 고객 반응, 실적 흐름을 비교적 냉정하게 보려고 하며 문제를 발견하면 빠르게 정리해서 해결 방향을 잡으려 합니다. \n\n다만 NP(배려,공감)의 점수가 가장 낮으면 신인의 감정 상태를 충분히 살피기 전에 해결과 수정 방향이 먼저 나오는 경우가 생길 수 있습니다. 코치 본인은 조직을 위해 필요한 말을 한다고 느끼지만 신인 입장에서는\n“결과만 중요하게 보는 것 같다.”\n“내 마음은 충분히 이해받지 못한 느낌이다.”\n“실수하면 바로 지적받을 것 같다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직의 흐름을 안정적으로 끌고 가는 힘은 매우 강하지만 신인의 감정과 긴장 상태를 풀어주는 표현이 부족해질 수 있는 구조입니다. 그래서 신인의 활동량을 더 끌어올리기 위해서는 문제를 바로 수정하려 하기 전에 먼저 신인의 상황과 마음 상태를 한 번 들어주는 습관이 중요합니다.\n\n특히 NP(배려,공감)가 낮은 코치는\n “요즘 가장 힘든 부분이 어떤 건가요?”\n “지금 계속 움직이고 계신 건 정말 잘하고 계십니다.”\n “혼자 너무 오래 끌고 가지 마시고 중간에 꼭 이야기해주세요.”\n같은 공감 문장을 의식적으로 먼저 사용하는 것만으로도 신인의 심리적 거리감이 크게 줄어들게 됩니다.\n\nOOO님은 원래 조직을 안정적으로 끌고 갈 수 있는 힘이 매우 강한 성향입니다. 여기에 따뜻한 인정과 공감 표현이 조금만 더해지면 신인의 움직임과 상담 약속이 훨씬 안정적으로 올라가게 됩니다.\n\n결국 OOO님의 성향의 핵심은 강한 책임감과 상황 정리 능력입니다. 다만 신인이 ‘이 코치는 내 상황도 이해하려고 한다’라는 느낌을 받을 수 있도록 공감의 표현을 조금 더 의식적으로 사용해야 신인의 활동량과 생산성도 더 오래 안정적으로 유지될 수 있습니다."
