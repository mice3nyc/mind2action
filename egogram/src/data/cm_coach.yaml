  A_NP_FC:
    manner: "OOO님은 조직 안에서 상황을 차분하게 정리하고 신인을 안정적으로 챙기려는 힘이 강한 성향입니다.\n\nA(이성,판단)의 점수가 높기 때문에 현재 상황을 객관적으로 보려고 합니다. 신인의 활동량, 고객 흐름, 상담 진행 상황, 계약 움직임 등을 비교적 냉정하게 확인하며 문제 원인을 빠르게 정리하려는 모습이 강하게 나타납니다. \n\n그리고 두 번째로 NP(배려,공감)가 높기 때문에 단순히 결과만 보는 코치가 아니라 신인의 감정 상태와 어려움도 함께 보려고 합니다. 신인이 힘들어하면 먼저 이유를 들어주려 하고 쉽게 포기하지 않도록 옆에서 계속 챙겨주려는 모습도 나타납니다.\n\n다만 FC(친화,표현)의 점수가 가장 낮으면 조직 안에서 분위기를 부드럽게 풀어주거나 감정을 편안하게 표현하는 부분은 부족해질 수 있습니다. 코치 본인은 충분히 설명하고 공감하고 있다고 느끼지만 신인 입장에서는\n“조금 어렵게 느껴질 때가 있다.”\n“칭찬과 반응 표현이 부족하다.”\n“긴장감이 오래 유지된다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 논리적 분석의 힘과 신인을 배려하는 힘은 매우 좋지만 신인이 즐겁게 움직일 수 있는 분위기를 만드는 부분은 부족해질 수 있는 구조입니다. 그래서 신인을 독려할 수 있는 표현을 의식적으로 자주 사용하는 습관이 중요합니다.\n\n특히 OOO님은 “이 부분은 이렇게 정리하겠습니다.”처럼 결론 중심으로만 이야기하기보다\n“고생 많으셨습니다.”\n“지금 계속 움직이고 계신 부분이 정말 좋습니다.”\n“오늘 분위기 좋게 잘 버텨주셨습니다.”\n같은 짧은 인정 표현을 자주 넣어주는 것이 필요합니다.\n\n그리고 OOO님의 성향은 실행 움직임을 끌어가는 힘도 좋은 편이기 때문에 분위기를 안정적으로 만든 뒤에는 반드시 실제 행동으로 연결해주는 흐름이 필요합니다. 예를 들어\n“그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”\n처럼 현실적인 움직임으로 연결해주는 표현이 함께 들어가야 신인의 성장이 살아나게 됩니다.\n\nOOO님의 성향은 원래 조직의 원칙과 기준 그리고 안정감을 함께 유지하는 힘이 매우 뛰어난 성향입니다. 여기에 조금 더 부드러운 반응과 밝은 표현이 더해지면 신인의 활동량과 생산성 흐름도 훨씬 안정적으로 올라가게 됩니다."
