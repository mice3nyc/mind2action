cm4_3:
  all_no_coaching: |-
    OOO님은 모든 점수가 '조율이 필요 없는 구간'에 있습니다.
    다섯 가지 성향이 모두 조율이 필요 없는 구간에 있다는 것은 특정 성향 하나가 강한 것이 아니라, 신인을 육성할 때 필요한 다양한 역할을 상황에 맞게 자연스럽게 사용할 수 있다는 의미입니다.
    신인에게 방향을 제시해야 할 때는 기준을 분명하게 설명할 수 있고, 어려움을 겪는 신인에게는 진심으로 공감하며 이야기를 들어줄 수 있습니다.
    또한 신인의 활동을 점검할 때는 감정에 치우치지 않고 현실적으로 판단할 수 있으며, 교육과 면담에서는 편안한 분위기를 만들면서도 실행으로 연결시키는 힘을 가지고 있습니다.

    특히 코치에게는 다섯 가지 성향의 균형이 매우 중요합니다.
    기준만 강하면 신인이 부담을 느낄 수 있고, 배려만 강하면 행동이 느슨해질 수 있습니다. 하지만 현재는 이러한 요소들이 한쪽으로 치우치지 않고 균형을 이루고 있기 때문에 신인은 안정감을 느끼고 코치님을 신뢰할 가능성이 높습니다.

    지금은 이러한 요소들이 한쪽으로 치우치지 않고 균형을 이루고 있기 때문에 신인은 안정과 신뢰를 가지며, 활동량과 생산성이 꾸준히 유지될 가능성이 높습니다.

    ⚠️ 만약 다섯 가지 성향 중 17점 이상인 항목이 있다면, 해당 성향의 에너지가 강하게 발휘되는 상태입니다. 이는 큰 강점이 될 수 있지만, 상황에 따라 상대방이 다소 과하게 느낄 수도 있습니다. 이 부분만 의식적으로 조율하면 더욱 균형 잡힌 관계와 성과에 도움이 됩니다.
        또한 가장 낮은 성향은 성과와 인간관계에서 반복적으로 나타나는 아쉬움의 원인이 될 수 있습니다. 가장 낮은 성향을 잘 이해하고 의식적으로 활용하려는 노력이 더해지면 강점은 더욱 빛을 발하게 됩니다.
  some_coaching: ''
cm4_4:
  CP:
    condition: 0-7
    trait: 조심성이 많고 겸손하며 의견을 아낍니다
    coaching: "이 성향은 사람을 존중하고 배려하며 신인이 편안하게 의견을 낼 수 있는 분위기를 만드는 장점이 있습니다. \n다만 신인의 생각을 존중하는 마음이 큰 만큼 기준을 분명하게 제시해야 하는 순간에도 결정을 미루거나 표현을 조심스럽게 하는 경우가 있습니다. 코치는 공감도 중요하지만 방향을 정해주는 역할도 필요합니다. 의견을 충분히 들은 뒤에는 \"좋은 의견입니다. 그럼 이번에는 이 방향으로 진행해봅시다.\", \"우선 이것부터 실행해보겠습니다.\" 와 같이 기준과 결론을 명확하게 전달하는 습관을 가지면 신인의 실행력이 더욱 높아질 수 있습니다."
    script: ''
  NP:
    condition: 0-7
    trait: 솔직하고 직설적이며 공감표현이 약합니다.
    coaching: |-
      이 성향은 감정에 흔들리지 않고 핵심을 빠르게 파악하여 현실적으로 판단하는 장점이 있습니다.
      다만 바쁠수록 신인의 감정이나 마음을 살피기보다 문제 해결과 결과 중심으로 대화를 진행하는 경우가 있습니다. 신인은 해결책보다 먼저 이해받고 싶어 하는 경우가 많습니다. "고생 많으셨습니다.", "그 상황이면 충분히 힘들 수 있었겠네요." 와 같은 공감의 말을 먼저 건넨 후 코칭을 진행하면 신인의 신뢰와 수용성이 더욱 높아질 수 있습니다.
    script: ''
  A:
    condition: 0-7
    trait: 직관과 경험을 중시하며 감정적인 판단을 하는 편입니다.
    coaching: "이 성향은 풍부한 경험과 직관을 활용하여 빠르게 판단하고 실행으로 연결하는 장점이 있습니다. \n다만 바쁠수록 현재 상황을 객관적으로 분석하기보다 경험이나 느낌을 기준으로 판단하는 경우가 있습니다. 코치는 신인에게 설명할 때도 느낌보다 사실과 근거를 중심으로 전달하는 것이 중요합니다. \"현재 상황을 보면 이 부분이 가장 중요합니다.\", \"지금은 이 방법이 가장 효과적인 이유가 있습니다.\" 와 같이 이성과 판단을 바탕으로 설명하면 신인의 이해와 실행력이 더욱 높아질 수 있습니다."
    script: ''
  FC:
    condition: 0-7
    trait: 과묵하고 조용하며 감정표현이 적습니다.
    coaching: "이 성향은 진중하고 신뢰감 있는 태도로 신인에게 안정감을 주는 장점이 있습니다. \n다만 바쁠수록 표정 변화나 감정 표현이 줄어들어 신인이 거리감을 느끼는 경우가 있습니다. 좋은 의도를 가지고 있어도 표현이 부족하면 관심이 없거나 만족하지 않는다고 오해받을 수 있습니다. 의식적으로 미소를 띄고 고개를 끄덕이며 \"좋습니다.\", \"잘하셨습니다.\", \"수고 많았습니다.\" 와 같은 긍정적인 표현을 자주 사용하면 신인의 동기부여가 크게 달라질 수 있습니다."
    script: ''
  AC:
    condition: 0-7
    trait: 주관이 강하고 자기 기준이 또렷합니다
    coaching: "이 성향은 주관과 결단력이 뚜렷하며 흔들림 없이 방향을 제시하는 장점이 있습니다. \n다만 자신의 생각이 분명한 만큼 바쁠수록 신인이 따라오는 속도까지 살피지 못하는 경우가 있습니다. 코치는 앞에서 끌고 가는 것도 중요하지만 뒤에서 따라오는 사람도 함께 봐야 합니다. 방향은 분명하게 알려주되 신인이 이해하고 따라올 수 있는 시간을 주고, 내 기준만 말하기보다 상대가 받아들일 수 있는 속도에 맞춰 설명해야 합니다. 그렇게 해야 신인의 신뢰와 실행력을 높이는 데 도움이 될 수 있습니다."
    script: ''
cm4_5: |-
  OOO님께서 현재 조율 포인트를 이미 인식하고 계시고, 평소 의식적으로 말과 행동에 반영하고 계신다면 강점이 더욱 안정적으로 발휘되어 지금도 좋은 성과를 내고 계실 가능성이 높습니다.

  ⚠️ 만약 다섯 가지 성향 중 17점 이상인 항목이 있다면, 해당 성향의 에너지가 강하게 발휘되는 상태입니다. 이는 큰 강점이 될 수 있지만, 상황에 따라 상대방이 다소 과하게 느낄 수도 있습니다. 이 부분만 의식적으로 조율하면 더욱 균형 잡힌 관계와 성과에 도움이 됩니다.
      또한 가장 낮은 성향은 성과와 인간관계에서 반복적으로 나타나는 아쉬움의 원인이 될 수 있습니다. 가장 낮은 성향을 잘 이해하고 의식적으로 활용하려는 노력이 더해지면 강점은 더욱 빛을 발하게 됩니다.
cm5:
  CP_NP_A:
    manner: "OOO님은 조직 안에서 사람을 챙기려는 마음이 강하면서도 조직의 원칙과 기준 그리고 운영 방향을 놓치지 않으려는 성향이 강하게 나타납니다.\n\nCP(기준,결단)의 점수가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. \n\n그리고 두 번째로 NP(배려,공감)가 높기 때문에 단순히 압박만 주는 방식으로 관리하지 않습니다. 신인이 힘들어하면 먼저 이유를 들으려 하고, 상황을 이해하려 하며, 오래 함께 가고 싶은 마음이 큽니다. \n\n다만 A(이성,판단)의 점수가 가장 낮으면 한 가지 아쉬운 부분이 생길 수 있습니다. 코치 본인은 충분히 설명했다고 느끼는데 신인 입장에서는\n“그래서 지금 무엇부터 해야 하지?”\n“결국 어떤 행동을 먼저 바꾸라는 거지?”\n“우선순위가 잘 정리되지 않는다.”\n처럼 느끼는 경우가 많습니다.\n\n즉, OOO님의 성향은 공감과 배려는 충분하지만 실행 정리와 행동 방향이 흐려질 수 있는 구조입니다. 그래서 신인의 활동량을 더 끌어올리기 위해서는 공감 뒤에 행동을 남기는 습관이 중요합니다. 위로로 끝나는 것이 아니라 '그래서 지금 무엇을 해야 하는지'를 분명하게 남겨줘야 신인이 실제로 움직이기 시작합니다.\n\n특히 신인이 힘들어할 때\n“괜찮습니다.”\n“이해합니다.”\n“많이 힘드셨겠어요.”\n이런 말만 하고 끝나면 마음은 편해지지만 행동은 남지 않을 가능성이 있습니다.\n\n특히 OOO님은 “열심히 해봅시다.” 라는 격려만 반복하기보다\n“오늘 가장 먼저 해야 하는 건 고객 연락 10건입니다.”\n“이번 주는 상담 약속 확보에 집중해보시죠.”\n처럼 행동 순서를 구체적으로 정리해주는 것이 필요합니다.\n\nOOO님의 성향은 원래 사람을 오래 데리고 가는 힘이 강한 성향입니다. 여기에 실행 정리와 우선순위 안내가 조금만 더해지면 신인의 움직임과 상담 약속이 훨씬 안정적으로 올라가게 됩니다.\n\n결국 OOO님의 성향의 핵심은 따뜻함 자체가 아니라 따뜻함 뒤에 실행이 남도록 만드는 것입니다. 공감으로 마음을 열고 마지막에는 행동을 남겨야 신인의 활동량과 생산성도 함께 올라가게 됩니다."
    improvement: ''
  CP_NP_FC:
    manner: "OOO님은 조직 안에서 사람을 챙기려는 마음과 운영의 중심을 잡으려는 힘이 함께 강하게 나타나는 성향입니다.\n\nCP(기준,결단)의 점수가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. \n\n그리고 두 번째로 NP(배려,공감)가 높기 때문에 단순히 강하게 밀어붙이는 방식으로 조직을 운영하지 않습니다. 신인이 힘들어하면 먼저 이유를 들으려 하고, 상황을 이해하려 하며, 오래 함께 가고 싶은 마음이 큽니다. \n\n다만 FC(친화,표현)의 점수가 가장 낮으면 조직 안에서 한 가지 아쉬운 흐름이 생길 수 있습니다. 코치 본인은 진지하게 이야기하고 있다고 생각하지만 신인 입장에서는 표정이나 분위기가 다소 무겁게 느껴질 수 있고, 거리감이 생길 수도 있습니다.\n\n특히 결과와 실행을 중요하게 생각하는 말이 반복되면 신인은\n“계속 긴장된다.”\n“잘못하면 혼날 것 같다.”\n“가까이 다가가기 어렵다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직을 안정적으로 끌고 가는 힘은 강하지만 분위기를 즐겁게 풀어주는 표현과 감정 전달이 부족해질 수 있는 구조입니다.\n그래서 신인의 활동량을 더 끌어올리기 위해서는\n\n“요즘 너무 잘 하시고 계세요^^”\n“수고 많았어요 이 부분은  제가 높게 평가합니다.”\n“결과도 중요하지만 지금 과정도 아주 잘하고 있습니다.”\n같은 멘트를 먼저 넣어주는 것이 필요합니다.\n\n특히 FC(친화,표현)가 낮은 코치는 의식적으로 미소를 띄고 고개를 끄덕이는 행동만 추가해도 신인이 느끼는 심리적 압박감이 훨씬 줄어들게 됩니다.\n\nOOO님은 원래 조직을 오래 유지하고 사람을 책임감 있게 끌고 가는 힘이 매우 강한 성향입니다. 여기에 분위기를 조금 더 편안하게 만드는 표현이 더해지면 신인의 움직임과 상담 약속이 훨씬 안정적으로 올라가게 됩니다.\n\n결국 OOO님의 성향의 핵심은 강한 책임감과 배려를 가지고 있다는 점입니다. 다만 신인이 코치를 조금 더 편하게 느끼고 가까이 다가올 수 있도록 분위기를 부드럽게 풀어주는 표현이 함께 들어가야 신인의 활동량과 생산성도 더 안정적으로 올라가게 됩니다."
