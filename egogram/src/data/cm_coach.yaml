  FC_AC_CP:
    manner: |-
      이 성향의 코치는 조직 안에서 분위기를 밝고 편안하게 만들면서 사람 간의 관계 흐름을 안정적으로 유지하려는 힘이 강한 성향입니다.

      제일 높은 점수인 FC가 높기 때문에 조직 분위기를 너무 무겁게 끌고 가지 않습니다. 신인과 이야기할 때 비교적 밝고 편안한 분위기를 만들려고 하며 조직 안의 긴장감을 줄이고 활동 분위기를 살리려는 힘도 강하게 나타납니다. 그래서 신인 입장에서는
      “같이 움직이면 힘이 난다.”
      “조직 분위기가 답답하지 않다.”
      “편안하게 다가갈 수 있다.”
      라는 인상을 받는 경우가 많습니다.

