    manner: "OOO님은 조직 안에서 실행력과 분위기를 동시에 끌고 가는 힘이 강한 성향입니다.\n\nCP(기준,결단)의 점수가 높기 때문에 조직의 원칙과 기준 그리고 실행 수준을 중요하게 생각합니다. \n\n그리고 두 번째로  FC(친화,표현)가 높기 때문에 조직 분위기를 너무 무겁게 끌고 가지 않습니다. 신인과 이야기할 때 비교적 밝고 편안한 분위기를 만들려고 하며, 상담 현장이나 회의 분위기가 너무 가라앉지 않도록 에너지를 살리려는 모습도 강하게 나타납니다. \n\n다만 NP(배려,공감)의 점수가 가장 낮으면 신인의 감정 상태와 속마음을 깊게 공감해주는 부분이 부족해질 수 있습니다. 코치 본인은 분위기도 좋고 방향도 잘 잡아주고 있다고 느끼지만 신인 입장에서는\n“내 마음까지 충분히 이해받는 느낌은 아니다.”\n“결국 결과 중심으로 느껴질 때가 있다.”\n“힘든 상황을 길게 이야기하기 어렵다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직의 움직임과 분위기를 끌어올리는 힘은 강하지만 신인의 감정을 오래 들어주고 공감하는 부분이 부족해질 수 있는 구조입니다. 그래서 신인의 활동량을 더 끌어올리기 위해서는 분위기를 살리는 것만으로 끝나는 것이 아니라 신인의 현재 상태를 차분하게 들어주는 시간이 함께 필요합니다.\n\n특히 OOO님은 “괜찮습니다. 다시 해보면 됩니다.”라고 빠르게 넘어가기보다\n“지금 어떤 부분이 가장 힘드셨나요?”\n“최근에 마음이 가장 무거웠던 순간이 언제였나요?”\n처럼 현재 감정 상태를 먼저 물어보는 습관이 중요합니다.\n\n또한 FC(친화,표현)가 높은 코치는 조직 분위기를 밝게 만들려는 힘이 강하기 때문에 신인이 보내는 무거운 신호를 가볍게 넘길 가능성도 있습니다. 그래서 분위기를 올리는 말 뒤에는 반드시 현재 상태를 확인하는 질문이 함께 들어가야 신인이 심리적으로 더 오래 버틸 수 있게 됩니다.\n\nOOO님의 성향은 원래 조직의 활동량과 움직임을 끌어올리는 힘이 매우 좋은 성향입니다. 여기에 공감과 경청이 조금 더해지면 신인의 활동량과 생산성 흐름도 더 안정적으로 올라가게 됩니다."
