  CP_FC_NP:
    manner: |-
      신인을 코칭할 때의 말투는 기준이 분명하고 말이 빠르며, 분위기를 끌어올리는 힘이 강한 방식입니다. “이건 이렇게 해야 돼”, “이 정도는 바로 할 수 있어”처럼 정답을 바로 제시하는 말을 자주 쓰고, 중간중간 농담이나 웃음으로 분위기를 살립니다. 그래서 신인은 처음에는 “와, 에너지 있고 시원하다”라고 느끼지만, 시간이 지나면 마음이 충분히 이해받고 있다는 느낌은 부족해질 수 있습니다. 이 성향은 성과 중심적이고 추진력이 뛰어나지만, 신인의 감정 상태나 불안, 속도 차이를 세심하게 살피는 말은 상대적으로 적게 나옵니다. 그 결과 신인은 “못 따라가면 혼날 것 같다”, “질문하면 분위기를 깨는 것 아닐까” 하고 마음을 닫을 수 있습니다.

      그래서 이 성향은 의식적으로 공감하는 말을 먼저 꺼내는 조절이 필요합니다. 설명이나 지시 전에 신인의 마음을 한 번 짚어주면 코칭 효과가 크게 달라집니다. 예를 들어 바로 “이건 이렇게 해”라고 말하기보다, “이 부분이 조금 어려웠을 수 있어”, “처음이면 헷갈리는 게 당연해” 같은 말을 먼저 얹는 것입니다. 이렇게 하면 신인은 “아, 나를 이해해주는구나”라고 느끼고 다시 집중하게 됩니다.

      개선 시 고정멘트는 반복해서 써야 효과가 있습니다. 첫 번째 고정멘트는 “지금 네가 느끼는 부담부터 말해줘도 괜찮아.”입니다. 이 말은 신인의 감정을 밖으로 꺼내게 해 줍니다. 두 번째 고정멘트는 “기준은 분명하지만, 속도는 네 상황에 맞춰도 돼.”입니다. 성과 기준을 유지하면서도 압박을 낮춰 줍니다. 세 번째 고정멘트는 “잘하려는 마음은 이미 충분해, 지금은 하나만 정확히 해보자.”입니다. 이 말은 신인의 불안을 줄이고 행동을 단순하게 만듭니다.

      이 세 문장을 의식적으로 사용하면, 강한 기준과 밝은 에너지는 그대로 살리면서도 신인의 마음을 놓치지 않는 코칭이 됩니다. 신인은 “엄격하지만 나를 이해해주는 사람”이라고 느끼게 되고, 결국 더 오래, 더 안정적으로 따라오게 됩니다.
