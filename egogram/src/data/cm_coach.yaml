  A_CP_AC:
    manner: |-
      신인을 코칭할 때의 말투는 차분하게 정리하면서도 기준을 분명히 말하는 설명형 말투입니다. TOP1이 A라서 이 코치님은 감정에 휘둘리지 않고 상황을 차분히 정리해 줍니다. “지금 단계는 어디까지 왔는지”, “왜 이 결과가 나왔는지”, “다음에 무엇을 바꾸면 되는지”를 순서대로 설명합니다. 여기에 TOP2가 CP이기 때문에 말이 또렷하고 기준이 분명합니다. “이건 반드시 지켜야 해”, “이 순서는 건너뛰면 안 돼”처럼 방향을 정확히 제시합니다. 그래서 신인은 해야 할 일이 명확해지고, 길을 잃지 않는 느낌을 받습니다.

      하지만 BOTTOM1이 AC라서 이 코치님은 신인의 반응이나 기분을 살피는 말이 다소 적은 편입니다. 신인의 입장을  조금은 덜 살피고 곧바로 본론으로 들어가는 성향에 가깝습니다. 그래서 신인이 힘들어하거나 위축되어 있어도, 코치님은 “그건 감정의 문제야”라며 바로 해결 방법부터 말할 수 있습니다. 이때 신인은 “맞는 말이긴 한데 마음은 잘 안 알아주는 것 같다”고 느낄 수 있습니다.

      이 성향의 코치님은 의식적으로 상대의 상태를 먼저 확인하는 한 문장을 넣는 연습이 필요합니다. 설명과 지적 전에 감정을 짧게 짚어주면 코칭이 훨씬 부드러워집니다.
      첫 번째 고정 멘트는
      “지금 이 상황이 쉽지 않았을 것 같아.”
      신인의 감정을 먼저 인정해 주는 문장입니다.

      두 번째 고정 멘트는
      “네 입장에서는 이렇게 느낄 수 있어.”
      공감의 문장을 먼저 말한 뒤 기준을 설명하는 데 도움이 됩니다.

      세 번째 고정 멘트는
      “그래도 우리가 지켜야 할 기준은 이거야.”
      공감 뒤에 방향을 분명히 제시하는 문장입니다.

      이 고정 멘트를 반복하면, 이 성향의 코치님은 차분하고 논리적이면서도 사람을 배려하는 코치님로 보이게 됩니다. 신인은 지적만 받는 느낌이 아니라, 이해받으면서도 분명한 방향을 안내받는다고 느끼게 됩니다.
