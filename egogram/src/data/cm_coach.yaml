  AC_FC_CP:
    manner: "OOO님은 조직 안에서 분위기를 편안하게 유지하면서 신인 상태를 안정적으로 관리하려는 힘이 강한 성향입니다.\n\nAC(협조,조율)의 점수가 높기 때문에 조직 안의 분위기와 신인의 상황을 많이 살피는 편입니다. 신인이 부담을 느끼지 않도록 조심하려 하고 조직 안에서 충돌이 커지지 않도록 흐름을 안정적으로 조율하려는 모습도 나타납니다.\n\n그리고 두 번째로  FC(친화,표현)가 높기 때문에 조직 분위기를 너무 무겁게 끌고 가지 않습니다. 신인과 이야기할 때 비교적 밝고 편안한 분위기를 만들려고 하며 조직 안의 긴장감을 줄이고 활동 분위기를 살리려는 힘도 강하게 나타납니다. \n\n다만 CP(기준,결단)의 점수가 가장 낮으면 방향을 강하게 잡아주거나 실행 움직임을 밀어주는 힘은 부족해질 수 있습니다. 코치 본인은 충분히 분위기도 좋게 만들고 조직도 잘 챙기고 있다고 느끼지만 신인 입장에서는\n“결론이 조금 약하다.”\n“긴장감이 흐려질 때가 있다.”\n“좋은 분위기인데 실행 압박은 약하다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직의 안정감과 분위기를 만드는 힘은 매우 좋지만 실행 움직임을 강하게 끌어올리는 부분은 조금 의식할 필요가 있는 구조입니다. 그래서 신인이 지금 반드시 해야 하는 행동을 짧고 분명하게 정리해주는 습관이 중요합니다.\n\n예를 들어 OOO님은 “괜찮습니다. 천천히 해봅시다.”라는 말만 반복하기보다\n“그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”\n“이번 주는 보장분석과 설계활동 일일 세 건씩 하는 것에 집중해 보시지요.”\n처럼 실제 움직임으로 연결되는 표현을 의식적으로 사용하는 것이 중요합니다.\n\n또한 AC(협조,조율)와 FC(친화,표현)가 함께 높은 코치는 조직 분위기와 관계 유지력은 매우 좋은 편이지만 신인의 부담을 너무 고려하다 보면 꼭 해야 하는 이야기를 늦게 꺼내는 경우도 생길 수 있습니다. 그러다 보면 조직 전체 활동량이 점점 느슨해질 가능성도 있습니다. 그래서 충분히 듣고 조율해준 뒤에는 행동 목표를 짧고 분명하게 정리해주는 과정이 함께 들어가야 신인의 성장이 살아나게 됩니다.\n\nOOO님의 성향은 원래 조직 분위기와 사람의 에너지를 살리는 힘이 매우 뛰어난 성향입니다. 여기에 실행 움직임을 조금 더 끌어주는 힘이 더해지면 신인의 활동량과 생산성 흐름도 훨씬 안정적으로 올라가게 됩니다."
