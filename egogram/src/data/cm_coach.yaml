    manner: "OOO님은 조직 안에서 흐름을 안정적으로 유지하면서도 실행 움직임을 놓치지 않으려는 힘이 강한 성향입니다.\n\nAC(협조,조율)의 점수가 높기 때문에 조직 안의 분위기와 신인의 상황을 많이 살피는 편입니다. 신인이 부담을 느끼지 않도록 조심하려 하고 조직 안에서 충돌이 커지지 않도록 흐름을 안정적으로 조율하려는 모습도 나타납니다.  \n\n그리고 두 번째로 CP(기준,결단)가 높기 때문에 단순히 분위기만 챙기는 것이 아니라 조직의 원칙과 기준 그리고 실행 수준도 중요하게 생각합니다. 활동량이 떨어질 때는 다시 흐름을 끌어올리려 하고 해야 할 부분은 비교적 분명하게 정리하려는 힘도 있습니다.  \n\n다만 FC(친화,표현)의 점수가 가장 낮으면 감정 표현과 반응 표현은 비교적 절제되어 보일 수 있습니다. 실제로는 충분히 배려하고 조심하고 있지만 표정 변화나 표현이 크지 않다 보니 신인 입장에서는\n“조금 어렵게 느껴진다.”\n“칭찬 표현이 적게 느껴진다.”\n“조심스럽게 느껴질 때가 있다.”\n라고 받아들이는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직의 안정감과 실행 흐름을 만드는 힘은 매우 좋지만 신인이 심리적으로 즐겁게 움직일 수 있는 분위기를 만드는 부분은 조금 의식할 필요가 있는 구조입니다. 그래서 신인의 활동을 독려하는 인정 표현을 자주 전달해주는 습관이 중요합니다.\n\n예를 들어 OOO님은.\n“고생 많으셨습니다.”\n“지금 계속 움직이고 계신 부분이 좋습니다.”\n“오늘 상담약속 잡은 거 너무 잘했습니다.”\n같은 짧은 인정 표현을 의식적으로 자주 사용하는 것이 좋습니다.\n\n그리고 충분히 듣고 인정 표현을 한 후에는\n“그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”\n처럼 실제 움직임으로 연결해주는 흐름이 함께 들어가야 신인의 성장이 살아나게 됩니다.\n\nOOO님의 성향은 원래 조직을 안정적으로 유지하면서도 실행 흐름을 끌어가는 힘이 매우 뛰어난 성향입니다. 여기에 조금 더 부드러운 반응과 밝은 표현이 더해지면 신인의 활동량과 생산성 흐름도 훨씬 안정적으로 올라가게 됩니다."
