job_type: coach
job_label: 코치/멘토
cm1:
  17-20:
    CP: 주장이 강함, 단호함, 책임감 강함, 밀어붙임, 기준과 통제가 높음.
    NP: 탁월한 공감능력, 강한 배려심, 보호본능, 신뢰형성
    A: 강한 분석력과 판단력, 명확성, 객관성, 높은 이성
    FC: 아주 밝음, 활발함, 표현 풍부, 친근함, 에너지, 다소 가벼움
    AC: 순응, 눈치, 조심, 맞춤형, 불안.
  14-16:
    CP: 결정력 있음, 믿음직한, 판단이 빠름, 기준과 통제가 있음.
    NP: 공감 잘함, 배려 깊음, 따뜻함, 신뢰감 있음, 안정적.
    A: 이성적, 균형감, 현실적, 분석적.
    FC: 밝음, 친화력, 유연함, 편안함, 자연스러움.
    AC: 협조, 적당한 순응, 적당한 눈치, 조율.
  11-13:
    CP: 균형감 있는 결정력, 유연한 기준과 통제, 보통의 주장성.
    NP: 적당한 친절, 예의 바름, 부담 없음.
    A: 평균적 분석, 보통의 현실감각, 보통의 이성과 상황 판단.
    FC: 안정감, 차분한, 균형감, 무난함.
    AC: 적응력, 균형감, 무난함, 순응과 직설의 중용.
  8-10:
    CP: 완화된 결정력과 주장성, 조금 망설임, 조율함.
    NP: 차분함, 무심해 보임, 실무형, 표현 적음.
    A: 감정이 우선, 계산이 다소 약함, 판단이 조금 흔들림.
    FC: 조용함, 신중함, 진지함, 다소 거리감
    AC: 독립적, 솔직함, 직설적, 자기 기준.
  0-7:
    CP: 우유부단, 착함,  결정 어려움, 말을 아낌.
    NP: 무뚝뚝함, 공감 부족, 차갑게 보임.
    A: 감정 몰임, 즉각 반응, 예술적, 판단과 논리가 조금 부족 .
    FC: 무표정, 감정 절제, 경직됨, 딱딱함.
    AC: 단호함, 직선적, 눈치 안 봄, 상대를 통제.
cm2:
  17-20:
    CP: 기준과 원칙이 아주 분명합니다. 상담 자리에서 말과 자세가 단정하고 자신감이 있습니다. “이 부분은 꼭 필요합니다”, “이 선택이 가장 안전합니다”처럼 단호하게 말합니다. 신인이 망설이면 방향을 잡아 주려는 마음이 강합니다. 다만 너무 확신에 찬 말투 때문에 신인이 압박을 느낄 수 있습니다.
    NP: 신인을 향한 마음의 온도가 매우 높습니다. 신인의 말을 들으면 먼저 이해하려 하고, 판단보다 공감을 앞세웁니다. 그래서 신인은 이분과 상담할 때 편안함을 느끼고, 자신의 이야기를 솔직하게 꺼내도 괜찮겠다는 신뢰를 갖게 됩니다. 힘든 상황에서도 끝까지 함께해 줄 사람이라는 확신을 주는, 관계의 기반을 만드는 따뜻한 힘이 있습니다.
    A: 신인과의 상담에서 감정에 치우치지 않고 사실과 흐름을 차분히 정리하는 능력이 뛰어납니다. 복잡한 조건 속에서도 핵심을 잡아 주기 때문에 신인은 방향을 잃지 않습니다. 설명은 명확하고 판단은 균형 잡혀 있어, 신인에게 안정감과 전문성을 동시에 느끼게 합니다. 믿고 맡길 수 있는 사람이라는 확신을 만드는 힘입니다.
    FC: 사람을 만나는 걸 정말 즐깁니다. 상담할 때 표정이 밝고 마음이 열려 있으며, 먼저 웃으며 말을 겁니다. 신인 이야기에 고개를 끄덕이고 반응이 빠릅니다. 말투는 부드럽고 친근해서 “아, 그런 상황이셨군요”처럼 공감부터 합니다. 분위기를 편안하게 풀어 주는 힘이 있어 신인이 긴장을 빨리 내려놓고, 핵심 메시지를 열린 마음으로 받아들이게 만드는 탁월한 장점이 있습니다.
    AC: 신인의 표정과 말투를 아주 민감하게 살핍니다. 신인이 불편해할까 봐 먼저 조심하고, 맞춰 주는 태도가 강합니다. 말할 때도 “괜찮으시면요”, “부담되시면 안 하셔도 돼요” 같은 표현을 자주 씁니다. 신인 기분은 잘 읽지만, 본인 의견을 끝까지 말하지 못해 설명이 흐려질 수 있습니다.
  14-16:
    CP: 책임감 있고 믿음직한 태도를 보입니다. 상담할 때 흐트러짐 없이 차분하게 설명하고, 중요한 포인트를 분명히 짚어 줍니다. 말투는 또렷하지만 공격적이지 않고 “이 기준으로 보시면 이해가 쉬워요”처럼 안내합니다. 신인은 코치를 통해 안정감과 신뢰를 느끼기 쉽습니다.
    NP: 따뜻하면서도 안정감 있게 신인을 대합니다. 신인 이야기를 잘 들어주고 고개를 끄덕이며 공감해 줍니다. 말투는 부드럽고 “그렇게 느끼실 수 있어요”, “많이 고민되셨죠” 같은 표현을 자연스럽게 씁니다. 필요할 때는 조심스럽게 방향을 제시해 신인이 혼자 결정한다고 느끼게 해줍니다. 신뢰받기 쉬운 태도입니다.
    A: 감정보다 이성과 논리로 코칭합니다. 신인의 이야기를 차분히 듣고, 필요한 정보만 골라 쉽게 코칭합니다. “걱정되실 수 있어요. 그래서 이 상황에서는 이렇게 해 봅시다”처럼 짧게 공감을 한 후에 코칭을 합니다. 말투가 안정적이고 판단이 흔들리지 않아 신인이 신뢰하기 쉽습니다. 가장 이상적인 면담 태도입니다.
    FC: 편안한 분위기를 자연스럽게 만듭니다. 자세는 안정적이고 표정도 부드러워 신인이 긴장을 풀기 쉽습니다. 말할 때는 웃음과 공감을 섞어 “편하게 생각하셔도 됩니다”라고 말합니다. 분위기는 밝고 과하지 않아 상담이 부담스럽지 않습니다.
    AC: 상황을 보며 말을 고르는 편입니다. 신인 반응을 보면서 속도를 조절하고, 무리하게 밀지 않습니다. “이 부분은 신인 상황에 맞춰 생각해 보셔도 돼요”처럼 부드럽게 말합니다. 배려와 안정감은 주지만, 결정이 늦어질 수 있습니다.
  11-13:
    CP: 상황에 맞게 유연하게 대응합니다. 자기 의견도 있지만 신인 말도 잘 듣습니다. 상담에서는 “제 생각은 이렇지만, 신인 상황도 중요합니다”처럼 균형 잡힌 말을 합니다. 강하게 밀어붙이지도, 너무 물러서지도 않아 편안한 상담이 됩니다. 신인은 부담 없이 설명을 받아들입니다.
    NP: 신인에게 예의 있게 대하고 필요한 설명을 차분히 합니다. 말은 짧고 정리되어 있으며 “이 부분은 이렇게 보시면 돼요”처럼 담백한 표현을 씁니다. 신인은 부담 없이 설명을 듣는 느낌을 받습니다. 다만 공감하는 표현을 조금만 더 한다면 신인의 만족도는 더 상승합니다.
    A: 상황에 따라 감정과 논리를 오가며 상담합니다. 신인 반응을 보며 설명을 조절하고, 너무 딱딱하지도 너무 감정적이지도 않습니다. “이렇게 생각하실 수 있는데, 현실적으로 보면 이 선택이 좋아요”처럼 말합니다. 무난하지만 결정이 조금 늦어질 수 있어 정리 멘트가 필요합니다.
    FC: 무난하고 차분한 태도를 보입니다. 자세는 바르고 표정은 안정적입니다. 말투는 또렷하지만 감정 표현은 많지 않습니다. “이 부분을 설명드리겠습니다”처럼 설명 중심으로 말합니다. 편하지도 불편하지도 않은 느낌을 주며, 신인은 안정감을 느낍니다. 다만 의식적으로 밝음이 다소 필요합니다.
    AC: 신인 눈치도 보고 자기 생각도 말할 줄 압니다. 분위기가 무겁지 않게 유지하면서도 필요한 설명은 분명히 합니다. “이건 장단점이 있어요. 신인께 맞는 쪽을 같이 보죠”처럼 균형 잡힌 말투를 씁니다. 신인도 부담 없이 듣습니다.
  8-10:
    CP: 신인을 존중하면서도 자기 생각을 조금씩 말할 수 있습니다. 상담할 때 “제 경험으로 보면 이 방법이 더 안전해요”처럼 조심스럽게 방향을 제시합니다. 신인을 몰아붙이지는 않지만, 완전히 맡기지도 않습니다. 다만 확신이 조금은 약해 보여서 신인이 결정을 미루는 경우가 가끔 생기기도 합니다.
    NP: 신인을 존중하긴 하지만 말수가 많지 않습니다. 상담에서는 설명 위주로 말하며 “이 상품은 이런 구조입니다”처럼 사실 중심으로 이야기합니다. 공감 표현은 적어 다소 차갑게 느껴질 수 있지만, 일은 또렷하게 진행됩니다. 신인에 따라 거리감이 느껴질 수 있습니다.
    A: 신인의 이야기를 잘 듣고 이해하려고 노력합니다. 다만 코칭 과정에서 사실 확인이나 원인 분석보다 다소 감정적인 해석이나 경험 중심의 판단에 의존하는 경우가 있어, 문제의 원인과 해결 방법을 한 번 더 정리하는 습관이 필요합니다.
    FC: 조용하고 진지한 모습이 강합니다. 상담 중 말수가 적고 표정 변화도 크지 않습니다. 자세는 단정하지만 다소 굳어 보일 수 있습니다. 말할 때는 필요한 말만 짧게 하며 감정 표현이 거의 없습니다. 신인은 신뢰는 느끼지만 “조금 신중하다”고 느낄 수 있습니다.
    AC: 신인 반응에 크게 흔들리지 않습니다. 자기 기준으로 차분하게 설명하고, 필요하면 직설적으로 말합니다. “이 상품은 이런 분께 맞습니다”처럼 간단히 말합니다. 솔직해서 신뢰는 주지만, 예민한 신인에게는 조금은 차갑게 느껴질 수 있습니다.
  0-7:
    CP: 자기 기준을 강하게 내세우지 않습니다. 상담할 때 신인 말을 먼저 듣고, 웬만하면 반대하지 않습니다. “신인 생각이 맞아요”, “원하시는 대로 하셔도 됩니다”라는 말을 자주 합니다. 분위기는 편하지만, 신인이 “그래서 뭘 선택해야 하지?” 하고 헷갈릴 수 있습니다. 방향을 잡아주는 힘은 약한 편입니다.
    NP: 상대가 느끼기에 다소 차갑게 보일 수 있습니다. 상담할 때도 바로 본론으로 들어가며 “필요한 것만 말씀드리겠습니다”라는 식의 말투를 씁니다. 위로나 공감보다는 정보 전달이 중심입니다. 신인은 정확하다고 느낄 수 있지만, 마음을 이해받는 느낌은 적을 수 있습니다. 친절해 보이지 않는다는 오해를 받을 수 있습니다.
    A: 신인과 편안하게 소통하는 장점이 있습니다. 다만 코칭 과정에서 감정적인 판단이나 개인 경험을 사실보다 우선하는 경우가 있어, 이유와 근거를 함께 확인하는 습관을 갖는다면 코칭의 신뢰도가 더욱 높아질 수 있습니다.
    FC: 감정을 거의 드러내지 않습니다. 표정이 굳어 있고 몸도 긴장돼 보일 수 있습니다. 말투는 건조하고 설명 위주이며 공감 표현이 적습니다. 신인이 말을 해도 반응이 적어 “내 말이 전달됐나?”라고 느낄 수 있습니다. 신뢰는 줄 수 있지만 거리감이 커질 가능성이 있습니다.
    AC: 남의 시선을 크게 신경 쓰지 않습니다. 신인 눈치를 거의 보지 않고 자기 생각대로 말합니다. “이게 제일 합리적입니다”처럼 단정적인 표현이 많습니다. 자신감은 느껴지지만, 신인이 압박을 느끼는 경우가 발생할 수 있습니다.
cm3:
  CP_NP: |-
    OOO님은 말보다 행동으로 기준을 보여주는 힘을 가지고 있습니다. 원칙이 분명해 신인은 무엇을 해야 하는지 혼란스럽지 않습니다. 동시에 사람을 향한 따뜻함이 있어, 부족하다고 밀어내기보다 끝까지 곁에 둡니다. 그래서 신인은 “지적받아도 버려지지는 않겠구나”라는 깊은 신뢰를 느끼게 됩니다.

    CP(기준,결단)의 힘은 방향을 잡아 줍니다. 지금 무엇을 먼저 해야 하는지, 오늘 어디까지 가야 하는지를 분명히 알려줍니다. 여기에 NP(배려,공감)의 따뜻함이 더해지면, 그 방향은 압박이 아니라 안심이 됩니다. 신인은 통제당한다고 느끼지 않고, 보호받고 있다고 느끼며 움직입니다. 이 조합이 만들어내는 분위기는 “엄격하지만 안전한 공간”입니다.

    또한 OOO님은 결과 앞에서 책임지는 사람입니다. 성과가 나올 때만 옆에 서는 사람이 아니라, 잘 안 될 때 더 가까이 다가옵니다. 실수가 반복돼도 포기하지 않고, 속도가 느려도 기다릴 줄 압니다. 그 과정에서 신인은 자연스럽게 자신감을 회복하고 다시 도전할 힘을 얻습니다.

    시간이 흐를수록 신인들의 마음속에는 한 문장이 남습니다.
    “이 사람은 나를 키우는 사람이다.”
    이 믿음이 생길 때, 신인은 스스로 성장하려 하고 조직은 흔들리지 않는 힘을 갖게 됩니다.
  CP_A: |-
    OOO님은 기준을 말로 설명하는 데서 멈추지 않습니다. 왜 그 기준이 필요한지, 지키면 어떤 결과가 생기는지를 차분하게 보여줍니다. 신인은 감정이 아니라 납득으로 움직이게 됩니다. 그래서 흔들림이 적고, 한 번 이해한 원칙은 오래 갑니다.

    CP(기준,결단)의 힘은 방향을 명확하게 만듭니다. 해야 할 것과 하지 말아야 할 것을 분명히 가릅니다. 여기에 A(이성,판단)의 힘이 더해지면 판단이 감정에 휘둘리지 않습니다. 상황을 보고, 수치를 보고, 가능성을 계산하며 가장 현실적인 길을 안내합니다. 신인은 그 모습에서 “따라가면 된다”는 확신을 얻게 됩니다.

