  NP_FC_CP:
    manner: "OOO님은 조직 안에서 사람을 편안하게 만들고 분위기를 밝게 유지하는 힘이 매우 강한 성향입니다.\n\n NP(배려,공감)의 점수가 높기 때문에 신인의 감정 상태와 어려움을 잘 살피려고 합니다. 그래서 신인이 힘들어하면 먼저 이유를 들어주려 하고 쉽게 포기하지 않도록 옆에서 계속 챙겨주려는 모습이 강하게 나타납니다. \n\n그리고 두 번째로  FC(친화,표현)가 높기 때문에 조직 분위기를 너무 무겁게 끌고 가지 않습니다. 신인과 이야기할 때 비교적 밝고 편안한 분위기를 만들려고 하며, 조직 안의 긴장감을 줄이고 활동 분위기를 살리려는 힘도 강하게 나타납니다. \n\n다만 CP(기준,결단)의 점수가 가장 낮으면 방향을 강하게 잡아주거나 실행 움직임을 밀어주는 힘은 부족해질 수 있습니다. 코치 본인은 충분히 공감하고 격려하고 있다고 느끼지만 신인 입장에서는\n“결론이 조금 약하다.”\n“긴장감이 느슨해질 때가 있다.”\n“좋은 분위기인데 실행 압박은 약하다.”\n라고 느끼는 경우도 생길 수 있습니다.\n\n즉, OOO님의 성향은 조직 분위기와 관계 유지력은 매우 좋지만 실행 움직임을 강하게 끌어올리는 부분은 부족해질 수 있는 구조입니다. 그래서 신인이 지금 해야 하는 활동을 짧고 분명하게 정리해주는 습관이 중요합니다.\n\n예를 들어 OOO님은 “괜찮습니다. 천천히 해봅시다.”라는 말만 반복하기보다\n“그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”\n“이번 주는 보장분석과 설계활동 일일 세 건씩 하는 것에 집중해 보시지요.”\n처럼 실제 움직임으로 연결되는 표현을 의식적으로 사용하는 것이 중요합니다.\n\n또한 NP(배려,공감)와 FC(친화,표현)가 함께 높은 코치는 신인과 관계가 좋아지는 대신 분위기가 너무 편안해져 실행 긴장감이 약해질 가능성도 있습니다. 그래서 충분히 공감해준 뒤에는 반드시 행동 목표를 짧고 명확하게 정리해주는 과정이 함께 들어가야 신인의 성장이 살아나게 됩니다.\n\nOOO님의 성향은 원래 조직의 분위기와 유지력을 매우 좋게 만드는 성향입니다. 여기에 실행 움직임을 조금 더 분명하게 끌어주는 힘이 더해지면 신인의 활동량과 생산성 흐름도 훨씬 안정적으로 올라가게 됩니다."
