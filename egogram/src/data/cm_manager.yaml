      그리고 두 번째로 AC(협조,조율)가 높기 때문에 조직 안의 분위기와 관계 흐름을 많이 살피는 편입니다. 구성원이 부담을 느끼지 않도록 조심하려 하고, 조직 안에서 충돌이 커지지 않도록 흐름을 조율하려는 모습도 나타납니다. 그래서 구성원 입장에서는
