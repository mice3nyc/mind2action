    다만 신경 써야 할 부분도 분명합니다. 상대를 챙기는 말이나 공감 표현이 부족해 보일 수 있습니다. 본인은 사실 위로하고 있다고 생각해도, 듣는 사람은 차갑다고 느낄 수 있습니다. 그러면 세 번째 요소인 신뢰감이 약해질 수 있습니다.

