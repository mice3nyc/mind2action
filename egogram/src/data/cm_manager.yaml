job_type: manager
job_label: 관리자
cm1:
  17-20:
    CP: 주장이 강함, 단호함, 책임감 강함, 밀어붙임, 기준과 통제가 높음.
    NP: 탁월한 공감능력, 강한 배려심, 보호본능, 신뢰형성
    A: 강한 분석력과 판단력, 명확성, 객관성, 높은 이성
    FC: 아주 밝음, 활발함, 표현 풍부, 친근함, 에너지, 다소 가벼움.
    AC: 순응, 눈치, 조심, 맞춤형, 불안.
  14-16:
    CP: 결정력 있음, 믿음직한, 판단이 빠름, 기준과 통제가 있음.
    NP: 공감 잘함, 배려 깊음, 따뜻함, 신뢰감 있음, 안정적.
    A: 이성적, 균형감, 현실적, 분석적.
    FC: 밝음, 친화력, 유연함, 편안함, 자연스러움.
    AC: 협조, 적당한 순응, 적당한 눈치, 조율.
  11-13:
    CP: 균형감 있는 결정력, 유연한 기준과 통제, 보통의 주장성.
    NP: 적당한 친절, 예의 바름, 부담 없음.
    A: 평균적 분석, 보통의 현실감각, 보통의 이성과 상황 판단.
    FC: 안정감, 차분한, 균형감, 무난함.
    AC: 적응력, 균형감, 무난함, 순응과 직설의 중용.
  8-10:
    CP: 완화된 결정력과 주장성, 조금 망설임, 조율함.
    NP: 차분함, 무심해 보임, 실무형, 표현 적음.
    A: 감정이 우선, 계산이 다소 약함, 판단이 조금 흔들림.
    FC: 조용함, 신중함, 진지함, 다소 거리감
    AC: 독립적, 솔직함, 직설적, 자기 기준.
  0-7:
    CP: 우유부단, 착함, 결정 어려움, 말을 아낌.
    NP: 무뚝뚝함, 공감 부족, 차갑게 보임.
    A: 감정 몰임, 즉각 반응, 예술적, 판단과 논리가 조금 부족
    FC: 무표정, 감정 절제, 경직됨, 딱딱함.
    AC: 단호함, 직선적, 눈치 안 봄, 상대를 통제.
cm2:
  17-20:
    CP: 기준과 원칙이 아주 분명합니다. 면담 자리에서 말과 자세가 단정하고 자신감이 있습니다. “이 부분은 꼭 필요합니다”, “이렇게 하셔야 성과가 납니다”처럼 단호하게 말합니다. 구성원들이 망설이면 방향을 잡아 주려는 마음이 강합니다. 다만 너무 확신에 찬 말투 때문에 구성원들이 압박을 느낄 수 있습니다.
    NP: 구성원들을 향한 마음의 온도가 매우 높습니다. 구성원들의 말을 들으면 먼저 이해하려 하고, 판단보다 공감을 앞세웁니다. 그래서 구성원들은 이분과 상담할 때 편안함을 느끼고, 자신의 이야기를 솔직하게 꺼내도 괜찮겠다는 신뢰를 갖게 됩니다. 힘든 상황에서도 끝까지 함께해 줄 사람이라는 확신을 주는, 관계의 기반을 만드는 따뜻한 힘이 있습니다.
    A: 구성원들과의 상담에서 감정에 치우치지 않고 사실과 흐름을 차분히 정리하는 능력이 뛰어납니다. 복잡한 조건 속에서도 핵심을 잡아 주기 때문에 구성원들은 방향을 잃지 않습니다. 설명은 명확하고 판단은 균형 잡혀 있어, 구성원들에게 안정감과 전문성을 동시에 느끼게 합니다. 믿고 맡길 수 있는 사람이라는 확신을 만드는 힘입니다.
    FC: 구성원들을 만나는 걸 정말 즐깁니다. 면담할 때 표정이 밝고 마음이 열려 있으며, 먼저 웃으며 말을 겁니다. 구성원들 이야기에 고개를 끄덕이고 반응이 빠릅니다. 말투는 부드럽고 친근해서 “아, 그런 상황이셨군요”처럼 공감부터 합니다. 다만 분위기가 너무 가벼워 보이면 중요한 코칭이 가볍게 느껴질 수 있어 조절이 필요합니다.
    AC: 구성원들의 표정과 말투를 아주 민감하게 살핍니다. 구성원들이 불편해할까 봐 먼저 조심하고, 맞춰 주는 태도가 강합니다. 말할 때도 “괜찮으시면요”, “부담되시면 안 하셔도 돼요” 같은 표현을 자주 씁니다. 구성원들 기분은 잘 읽지만, 본인 의견을 끝까지 말하지 못해 코칭이 흐려질 수 있습니다.
  14-16:
    CP: 책임감 있고 믿음직한 태도를 보입니다. 면담할 때 흐트러짐 없이 차분하게 코칭하고, 중요한 포인트를 분명히 짚어 줍니다. 말투는 또렷하지만 공격적이지 않고 “이 기준으로 보시면 이해가 쉬워요”처럼 안내합니다. 구성원들은 리더를 통해 안정감과 신뢰를 느끼기 쉽습니다.
    NP: 따뜻하면서도 안정감 있게 구성원들을 대합니다. 구성원들 이야기를 잘 들어주고 고개를 끄덕이며 공감해 줍니다. 말투는 부드럽고 “그렇게 느끼실 수 있어요”, “많이 고민되셨죠” 같은 표현을 자연스럽게 씁니다. 필요할 때는 조심스럽게 방향을 제시해 구성원들이 혼자 결정한다고 느끼게 해줍니다. 신뢰받기 쉬운 태도입니다.
    A: 감정보다 이성과 논리로 코칭합니다. 구성원들 이야기를 차분히 듣고, 필요한 정보만 골라 쉽게 코칭합니다. “걱정되실 수 있어요. 그래서 이 상황에서는 이렇게 해 봅시다”처럼 짧게 공감을 한 후에 코칭을 합니다. 말투가 안정적이고 판단이 흔들리지 않아 구성원들이 신뢰하기 쉽습니다. 가장 이상적인 면담 태도입니다.
    FC: 편안한 분위기를 자연스럽게 만듭니다. 자세는 안정적이고 표정도 부드러워 구성원들이 긴장을 풀기 쉽습니다. 말할 때는 웃음과 공감을 섞어 “편하게 생각하셔도 됩니다”라고 말합니다. 분위기는 밝고 과하지 않아 면담이 부담스럽지 않습니다.
    AC: 상황을 보며 말을 고르는 편입니다. 구성원들 반응을 보면서 속도를 조절하고, 무리하게 밀지 않습니다. “이 부분은 ㅇㅇ님 상황에 맞춰 생각해 보셔도 돼요”처럼 부드럽게 말합니다. 배려와 안정감은 주지만, 결정이 늦어질 수 있습니다.
  11-13:
    CP: 상황에 맞게 유연하게 대응합니다. 자기 의견도 있지만 구성원들 말도 잘 듣습니다. 면담에서는 “제 생각은 이렇지만, ㅇㅇ님 상황도 중요합니다”처럼 균형 잡힌 말을 합니다. 강하게 밀어붙이지도, 너무 물러서지도 않아 편안한 면담이 됩니다. 구성원들은 부담 없이 코칭을 받아들입니다.
    NP: 친절하지만 감정에 너무 치우치지는 않습니다. 구성원들에게 예의 있게 대하고 필요한 코칭을 차분히 합니다. 말은 짧고 정리되어 있으며 “이 부분은 이렇게 보시면 돼요”처럼 담백한 표현을 씁니다. 공감도 하지만 과하지 않아 면담이 깔끔하게 끝납니다. 구성원들은 부담 없이 코칭을 듣는 느낌을 받습니다.
    A: 상황에 따라 감정과 논리를 오가며 면담합니다. 구성원들 반응을 보며 코칭을 조절하고, 너무 딱딱하지도 너무 감정적이지도 않습니다. “이렇게 생각하실 수 있는데, 현실적으로 보면 이 방법이 좋아요”처럼 말합니다. 무난하지만 결정이 조금 늦어질 수 있어 정리 멘트가 필요합니다.
    FC: 무난하고 차분한 태도를 보입니다. 자세는 바르고 표정은 안정적입니다. 말투는 또렷하지만 감정 표현은 많지 않습니다. “이 부분을 코칭드리겠습니다”처럼 코칭 중심으로 말합니다. 편하지도 불편하지도 않은 느낌을 주며, 구성원들은 안정감을 느끼며 “이 분은 전문가 답다"라고 느낌
    AC: 구성원들 눈치도 보고 자기 생각도 말할 줄 압니다. 분위기가 무겁지 않게 유지하면서도 필요한 코칭은 분명히 합니다. “이건 장단점이 있어요. ㅇㅇ님께 맞는 쪽을 같이 보죠”처럼 균형 잡힌 말투를 씁니다. 구성원들도 부담 없이 듣습니다.
  8-10:
    CP: 구성원들을 존중하면서도 자기 생각을 조금씩 말할 수 있습니다. 면담할 때 “제 경험으로 보면 이 방법이 더 안전해요”처럼 조심스럽게 방향을 제시합니다. 구성원들을 몰아붙이지는 않지만, 완전히 맡기지도 않습니다. 다만 확신이 조금은 약해 보여서 구성원들이 결정을 미루는 경우가 가끔 생기기도 합니다.
    NP: 배려하는 표현이 다소 적은 편입니다. 구성원들을 존중하긴 하지만 말수가 많지 않고 표정도 차분합니다. 면담에서는 코칭 위주로 말하며 “이 내용은 이런 구조입니다”처럼 사실 중심으로 이야기합니다. 공감 표현은 적어 다소 차갑게 느껴질 수 있지만, 일은 또렷하게 진행됩니다. 구성원들에 따라 거리감이 느껴질 수 있습니다.
    A: 느낌을 먼저 받아들이고 나중에 생각합니다. 구성원들 말에 공감은 잘하지만 코칭이 정리되지 않을 때가 있습니다. “괜찮을 것 같아요” 같은 표현이 많고, 이유 코칭은 약합니다. 말투는 부드럽지만 판단력이 약해 보일 수 있어, 미리 준비한 코칭을 쓰는 연습이 필요합니다.
    FC: 조용하고 진지한 모습이 강합니다. 면담 중 말수가 적고 표정 변화도 크지 않습니다. 자세는 단정하지만 다소 굳어 보일 수 있습니다. 말할 때는 필요한 말만 짧게 하며 감정 표현이 거의 없습니다. 구성원들은 신뢰는 느끼지만 “조금 신중하다”고 느낄 수 있습니다.
    AC: 구성원들 반응에 크게 흔들리지 않습니다. 자기 기준으로 차분하게 코칭하고, 필요하면 직설적으로 말합니다. “이 내용은 이렇게 해야 맞습니다”처럼 간단히 말합니다. 솔직해서 신뢰는 주지만, 예민한 구성원들에게는 조금은 차갑게 느껴질 수 있어서 이 점만 주위하면 됩니다.
  0-7:
    CP: 자기 기준을 강하게 내세우지 않습니다. 면담할 때 구성원들 말을 먼저 듣고, 웬만하면 반대하지 않습니다. “ㅇㅇ님 생각이 맞아요”, “원하시는 대로 하셔도 됩니다”라는 말을 자주 합니다. 분위기는 편하지만, 구성원들이 “그래서 뭘 선택해야 하지?” 하고 헷갈릴 수 있습니다. 방향을 잡아주는 힘은 약한 편입니다.
    NP: 상대가 느끼기에 다소 차갑게 보일 수 있습니다. 상담할 때도 바로 본론으로 들어가며 “필요한 것만 말씀드리겠습니다”라는 식의 말투를 씁니다. 위로나 공감보다는 정보 전달이 중심입니다. 구성원들은 정확하다고 느낄 수 있지만, 마음을 이해받는 느낌은 적을 수 있습니다. 친절해 보이지 않는다는 오해를 받을 수 있습니다.
    A: 면담 중 감정에 많이 휘둘립니다. 구성원들 표정이나 말에 따라 말이 바뀌고, 코칭보다 반응이 먼저 나옵니다. “아… 그러면 안 하셔도 돼요”처럼 쉽게 물러납니다. 친절해 보이지만 코칭하는 입장으로서의 신뢰는 떨어질 수 있어, 말하기 전 잠깐 생각하는 습관이 꼭 필요합니다.
    FC: 감정을 거의 드러내지 않습니다. 표정이 굳어 있고 몸도 긴장돼 보일 수 있습니다. 말투는 건조하고 코칭 위주이며 공감 표현이 적습니다. 구성원들이 말을 해도 반응이 적어 “내 말이 전달됐나?”라고 느낄 수 있습니다. 신뢰는 줄 수 있지만 거리감이 커질 가능성이 있습니다.
    AC: 남의 시선을 크게 신경 쓰지 않습니다. 구성원들 눈치를 거의 보지 않고 자기 생각대로 말합니다. “이게 제일 합리적입니다”처럼 단정적인 표현이 많습니다. 자신감은 느껴지지만, 구성원들이 압박을 느끼는 경우가 발생할 수 있습니다.
cm3:
  CP_NP: |-
    (CP 통제적부모 & NP 자상한부모가 각각 첫 번째와 두 번째로 높아 강점으로 발현됨.)

    이 성향의 리더는 조직이 기대하는 리더의 가장 이상적인 모습을 가지고 있습니다.
    왜냐하면 기준을 세우는 힘과 사람을 끝까지 품는 마음을 함께 갖추고 있기 때문입니다.

    구성원들은 무엇을 해야 하는지, 어디로 가야 하는지, 지금 내가 잘 가고 있는지 알고 싶어 합니다.
    리더는 애매한 표현 대신 분명한 방향을 제시합니다. 해야 할 것과 하지 말아야 할 것을 또렷하게 말해 주기 때문에 조직은 혼란이 줄어듭니다. 기준이 명확하면 사람은 안정감을 느끼고, 안정감 속에서 실력이 자랍니다.

    동시에 리더는 사람을 쉽게 놓지 않습니다.
    성과가 부족한 날에도 이유를 먼저 묻고, 다시 해볼 수 있도록 기회를 줍니다.
    혼내기보다 붙잡아 주는 시간이 많기 때문에 구성원들은 마음으로 충성하게 됩니다.
    “이분 밑에서라면 다시 한번 해보고 싶다”라는 생각이 자연스럽게 생깁니다.

    회사의 정책을 존중하면서도 현장의 마음을 이해하고, 현장의 어려움을 알면서도 원칙을 무너지게 두지 않습니다.
    그래서 위에서는 신뢰하고, 아래에서는 의지합니다.

    단단한 기준과 따뜻한 보호가 함께 있는 리더.
    조직이 오래가고 커질 수밖에 없는 이유가 바로 여기에 있습니다.
  CP_A: |-
    (CP 통제적부모 & A 어른자아가 각각 첫 번째와 두 번째로 높아 강점으로 발현됨.)

