  CP:
    condition: 0-7
    trait: (우유부단, 결정회피,관용적, 주장성부족,)의 조율 방법
    coaching: 이 성향은 기준을 분명히 말하지 못해 구성원들이 무엇까지 해야 하는지 헷갈려합니다. 리더는 “알아서 하겠지”라고 생각하지만, 구성원들은 방향을 못 잡고 시간을 흘려보냅니다. 그 결과 약속이 흐려지고, 코칭이 느슨해졌다는 느낌을 받기 쉽습니다.
    script: |-
      “이건 선택이 아니라, 지금 꼭 해야 하는 부분입니다.”

      “이 부분은 기준을 지켜야 합니다.”

      “제가 책임질 테니까, 이 방향대로 한 번 해봅시다.”
  NP:
    condition: 0-7
    trait: (공감부족,정서둔감,관계의거리감,차가움)의 조율 방법
    coaching: 이 성향은 설명은 잘해도 따뜻한 말이 부족해 구성원들이 “혼자 버티는 느낌”을 받습니다. 리더는 도와주고 있다고 생각하지만, 구성원들은 마음을 열지 못합니다. 그래서 질문을 안 하게 되고, 어려움이 있어도 숨기는 상황이 자주 생깁니다.
    script: |-
      “지금 많이 힘들어 보이는데, 그렇게 느끼는 게 자연스러운 겁니다.”

      “네 맞는 말씀입니다.” "네 이해가 됩니다." "네 공감이 많이 됩니다."

      “제가 옆에서 같이 볼 테니까, 혼자 버티려고 하지 마십시오.”
  A:
    condition: 0-7
    trait: (비논리,감정적,판단혼란,즉흥성)의 조율 방법
    coaching: 이 성향은 감정이나 경험 위주로 말하다 보니 코칭이 정리되지 않습니다. 구성원들은 “그래서 지금 뭘 해야 하지?”라고 느낍니다. 리더는 열심히 말했는데도 행동이 안 바뀌어 답답해지고, 같은 이야기를 반복하게 되는 경우가 많아집니다.
    script: |-
      “지금 가장 중요한 핵심부터 먼저 정리해드릴게요.”

      “지금은 여러 가지를 한꺼번에 하기보다, 우선순서 하나씩 정리해서 가는 게 중요합니다.”

      “먼저 방향부터 명확히 잡고, 그다음 방법을 함께 맞춰가겠습니다.”
  FC:
