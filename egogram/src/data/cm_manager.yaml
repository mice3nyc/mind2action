      즉, 이 성향은 조직의 실행력과 생산성을 안정적으로 끌고 가는 힘은 매우 좋지만 구성원이 심리적으로 편하게 움직일 수 있는 분위기를 만드는 부분은 부족해질 수 있는 구조입니다. 그래서 조직의 생산성과 매출을 더 끌어올리기 위해서는 결과와 방향만 이야기하는 것이 아니라 구성원이 편하게 움직일 수 있는 반응과 표현을 의식적으로 자주 사용하는 습관이 중요합니다.

