      “긴장감이 흐려질 때가 있다.”
      “좋은 분위기인데 실행 압박은 약하다.”
      라고 느끼는 경우도 생길 수 있습니다.

      즉, 이 성향은 조직의 안정감과 관계 유지력을 만드는 힘은 매우 좋지만 실행 움직임을 강하게 끌어올리는 부분은 조금 의식할 필요가 있는 구조입니다. 그래서 조직의 생산성과 매출을 더 끌어올리기 위해서는 공감과 조율만 만드는 것이 아니라 “지금 반드시 해야 하는 행동”을 짧고 분명하게 정리해주는 습관이 중요합니다.

