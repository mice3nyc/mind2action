      A(이성,판단)의 점수가 높기 때문에 감정적으로 흔들리기보다 현재 상황을 객관적으로 보려고 합니다. 구성원의 활동량, 고객 흐름, 상담 진행 상황, 계약 움직임 등을 비교적 냉정하게 확인하며 문제 원인을 빠르게 정리하려는 모습이 강하게 나타납니다. 그래서 조직원 입장에서는
