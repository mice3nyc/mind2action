    다만 기준을 세우고 방향을 잡아 주는 힘이 약하면, 좋아 보이기는 해도 결정적인 리더처럼 느껴지지 않을 수 있습니다. 너무 부드럽기만 하면 후보자는 “좋은 사람인데, 나를 성장시켜 줄 수 있을까?”라고 생각할 수도 있습니다.

