      “고생 많으셨습니다.”
      “지금 계속 움직이고 계신 부분이 좋습니다.”
      “오늘 고객 연락 흐름 잘 유지하고 계십니다.”
      같은 짧은 인정 표현을 의식적으로 자주 사용하는 것이 좋습니다.

