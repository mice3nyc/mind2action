      이 성향은 원래 조직 분위기를 살리면서도 흐름을 현실적으로 정리하는 힘이 매우 뛰어난 성향입니다. 여기에 상대의 감정 속도와 부담을 한 번 더 확인해주는 부드러운 접근이 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다
