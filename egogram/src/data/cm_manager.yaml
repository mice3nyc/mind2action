      이 성향은 원래 조직의 흐름과 생산성을 안정적으로 유지하는 힘이 매우 뛰어난 성향입니다. 여기에 부드러운 반응과 따뜻한 표현이 조금 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
