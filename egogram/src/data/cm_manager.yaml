    이 균형이 맞춰지면 후보자는 이 사람을 나를 정확히 이끌어 줄 리더, 현실적인 길을 알려주는 믿을 만한 사람, 함께하면 성장할 수 있을 것 같은 존재로 보게 됩니다. 차갑기보다는 단단하고, 부담스럽기보다는 의지하고 싶은 모습으로 기억됩니다.
  CP_AC_A: |-
