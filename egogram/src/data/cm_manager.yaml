      라고 바로 정리하기보다
      “지금 가장 버거운 부분은 어떤 건가요?”
      “요즘 코칭속도는 괜찮으신가요?”
      “지금 어떤 부분에서 가장 부담을 느끼고 계신가요?”
      같은 질문을 먼저 넣어주는 것이 중요합니다.

