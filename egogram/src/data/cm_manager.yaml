      그리고 충분히 듣고 조율해준 뒤에는
      “그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”
      처럼 실제 움직임으로 연결해주는 흐름이 함께 들어가야 조직의 활동량과 생산성이 안정적으로 유지될 수 있습니다.

      이 성향은 원래 조직을 안정적으로 유지하고 흐름을 현실적으로 관리하는 힘이 매우 뛰어난 성향입니다. 여기에 조금 더 부드러운 반응과 밝은 표현이 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
