      그리고 이 성향은 원래 조직 분위기와 실행 움직임을 강하게 끌어올리는 힘이 매우 뛰어난 성향입니다. 여기에 현실적인 우선순위 정리와 흐름 관리가 조금 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
