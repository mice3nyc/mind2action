    이 부분이 보완되면 후보자는 이 사람을 정답을 알고 있는 리더, 내 상황을 읽어 주는 사람, 따라가면 안전하게 성장할 수 있을 것 같은 존재로 느끼게 됩니다. 무섭기보다는 믿음직하고, 어렵기보다는 의지하고 싶은 모습으로 보이게 됩니다.
  CP_AC_FC: |-
