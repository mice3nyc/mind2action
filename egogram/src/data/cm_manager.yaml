    다만 조금 더 신경 쓰면 좋은 점은 따뜻하게 품어주는 표현입니다. 기준과 판단이 앞서다 보면 “맞는 말”은 잘다만, 상대 마음이 충분히 위로받는 느낌은 약해질 수 있습니다. 그래서 결론을 말하기 전에 공감 한마디를 먼저 건네는 습관이 중요합니다.
