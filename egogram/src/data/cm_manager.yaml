      그리고 두 번째로 NP(배려,공감)가 높기 때문에 단순히 결과만 보는 리더가 아니라 구성원의 감정 상태와 어려움도 함께 보려고 합니다. 구성원이 힘들어하면 먼저 이유를 들어주려 하고 쉽게 포기하지 않도록 옆에서 계속 챙겨주려는 모습도 나타납니다. 그래서 구성원 입장에서는
