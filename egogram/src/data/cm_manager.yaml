      처럼 결론 중심으로만 이야기하기보다
      “고생 많으셨습니다.”
      “지금 계속 움직이고 계신 부분이 정말 좋습니다.”
      “오늘 분위기 좋게 잘 버텨주셨습니다.”
      같은 짧은 인정 표현을 자주 넣어주는 것이 중요합니다.

