      그리고 두 번째로 FC(친화,표현)가 높기 때문에 조직 분위기를 너무 무겁게 끌고 가지 않습니다. 구성원과 이야기할 때 비교적 밝고 편안한 분위기를 만들려고 하며, 상담 현장이나 회의 분위기가 너무 가라앉지 않도록 에너지를 살리려는 모습도 강하게 나타납니다. 그래서 구성원 입장에서는
