      이 성향은 원래 조직 분위기와 활동 에너지를 끌어올리는 힘이 매우 뛰어난 성향입니다. 여기에 따뜻한 공감과 감정 확인이 조금 더해지면 조직의 유지력과 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
