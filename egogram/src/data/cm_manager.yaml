cm7: {}
cm8:
  CP_NP:
    encourage: "리더십이란 잃은 방향을 제시하고, 그 방향을 끝까지 지키는 용이다 \n-피터 드러커\n\n강한 기준은 사람을 억누르기 위해서가 아니라, 사람을 보호하기 위해 존재한다\n-임마누엘 칸트"
    improve: |-
      이해하려는 노력 없이 내려진 판단은 언제나 불완전하다
      -칼 로저스

      사람은 논리로 움직이지만, 마음으로 결정한다
      -블레즈 파스칼
  CP_A:
    encourage: "정의는 강한 의지에서 나온다\n의미-옳고 그름을 분명히 가르는 힘은 결단과 기준에서 나온다 \n-아리스토 텔레스\n\n원칙이 없는 타협은 방향을 잃게 된다 \n의미-CP의 성향 결단력, 기준제시를 격려-임마누엘 칸트"
    improve: |-
      코칭할 수 없다면, 아직 충분히 이해한 것이 아니다
      의미-코칭의 부족은 능력의 부족이 아니라 훈련의 부족이다
      -알베르트 아인슈타인
  CP_FC:
    encourage: |-
      올바른 판단은 인기보다 중요하다
      의미- 관계의 호불호보다 옳음을 선택하는 단호함이 리더십의 핵심임을 말함
      -피터 드러커
    improve: |-
      열정은 불꽃이 아니라 연료다. 관리하지 않으면 꺼진다"
      의미-FC가 약할수록 감정에 의존하지 않는 몰입과 집중이 필요함을 알려줌
      -프리드리히 니체
  CP_AC:
    encourage: |-
      정의는 힘이 없으면 공허하고, 힘은 정의가 없으면 폭력이다'
      의미-기준을 세우고 옳고 그름을 가르는 힘(CP)은 상황을 지탱하는 핵심 에너지다.
      -블레즈 파스칼
    improve: |-
      가장 강한 사람은 혼자 서는 사람이 아니라, 함께 움직일 줄 아는 사람이다
      -헬렌 켈러

      지혜로운 사람은 바람을 거스르지 않고, 돛의 각도를 조절한다
      -공자
  NP_CP:
    encourage: |-
      타인을 존중하는 마음이야말로 모든 관계의 시작이다
      -마하트마 간디

      사람은 이해받을 때 비로소 변화할 수 있다
      -칼 로저스
    improve: |-
      용기는 옳다고 생각하는 것을 말하는 데서 시작한다
      의미-내가 할 말을 하는 것은 용기이고 상과로 나타난다
      -루스벨트
  NP_A:
    encourage: |-
      사람은 비판으로 변하지 않고, 이해받을 때 성장한다
      -칼 로저스

      부드러움은 약함이 아니라, 가장 오래가는 힘이다
      -노자
    improve: |-
      생각하지 않으면 감정이 결정을 대신한다
      의미-A가 낮을 때 감정이나 분위기로 끌려감 이 문장은 ‘생각-판단-말'의 순서를 훈련하라는 의미
  NP_FC:
    encourage: |-
      이해받고 있다고 느끼는 순간, 사람은 스스로 움직이기 시작한다
      -칼 로저스

      타인을 이기는 사람은 힘이 세지만,타인을 품는 사람은 진정 강하다 -노자
    improve: |-
      느끼는 것을 표현하지 않으면, 그 감정은 사라지지 않고 안에 쌓인다.
      -프로이트

      자기 자신에게 솔직해질 때, 삶의 에너지가 흐르기 시작한다
      -칼 융
  NP_AC:
    encourage: |-
      사람은 이해받을 때 비로소 변화할 수 있다
      -칼 로저스

      부드러움은 가장 강한 설득이다
      -노자
    improve: |-
      상대를 고려하는 것은 약해지는 것이 아니라, 선택지를 넓히는 것이다
      의미-독립성을 해치지 않으면서 상대방과의 조율을 강조하는 문장
      -임마누엘 칸트
  A_CP:
    encourage: |-
      지혜란 감정을 제거하는 것이 아니라 감정위에 사고를 올리는 것이다
      의미-감정을 인식하되 판단은 이성적으로 하라는 뜻
      -아리스토텔레스
    improve: |-
      기준이 없는 친절은 결국 누구도 돕지 못한다
      의미-배려와 이해가 중요하지만, 명확한 기준과 방향 제시가 없으면 관계도 성과도 흐려진다는 뜻
      -피터 드러커
  A_NP:
    encourage: |-
      생각하고 판단하는 법을 배우는 것이야말로 인간의 가장 큰 자유다
      -에리히 프롬

      현명한 사람은 상황을 탓하지 않고, 상황을 이해한 뒤 선택한다
      의미-판단과 선택이 성숙함의 기준임
      -마르쿠스 아우렐리우스
    improve: |-
      사람들은 당신이 한 말은 잊을지라도, 당신이 느끼게 한 감정은 잊지 않는다
      의미-설득의 논리보다 면담에서 남는 것은 ‘내가 존중받았는가'라는 감정이라는 뜻
      -마야 안젤로
  A_FC:
    encourage: |-
      사실을 있는 그대로 보는 능력은 지혜의 시작이다
      -아리스토텔레스

      생각하는 데 시간을 쓰는 사람은, 행동에서 실수를 줄인다
      -발타자르 그라시안
    improve: |-
      느낀 것을 말하지 않으면, 아무도 그것을 이해할 수 없다.
      의미-감정을 숨긴 채로는 공감도, 연결도 일어날 수 없다는 뜻
      -칼 로저스
  A_AC:
    encourage: |-
      현상을 있는 그대로 볼 수 있는 사람만이 올바르게 판단할 수 있다
      -아리스토텔레스

      감정이 아닌 이성에 따라 행동할 수 있을 때, 인간은 선택의 자유가 생긴다.
      -스피노자
    improve: |-
      부드러움은 강함을 이긴다
      의미-밀어붙이는 힘보다, 상대를 살리며 가는 부드러움이 더 멀리 간다는 뜻
      -노자
  FC_CP:
    encourage: |-
      진정한 힘은 즐거움에서 나온다
      의미-자발적 에너지와 감정 표현은 사람을 움직이는 원천이며, 관계의 활력을 만든다
      -프리드리히 니체

      웃음은 두려움을 밀어내는 가장 인간적인 용기다
      -찰리 채플린
    improve: |-
      결단하지 않는 것도 하나의 선택이며, 그 또한 결과를 낳는다
      의미-결정을 안 하는 우유부단함도 책임이 따른다는 뜻
      -윌리엄 제임스
  FC_NP:
    encourage: |-
      열정은 전염된다
      의미- 당신의 에너지와 감정 표현은 상대의 분위기를 바꾼다.
      -랄프 왈도 에머슨

      당신이 웃을 때, 세상은 당신 편이 된다.
      의미-감정 표현과 밝음은 사람 마음을 여는 가장 빠른 언어다
      -윌리엄 제임스
    improve: |-
      사람은 논리로 설득되기보다, 이해받았다고 느낄 때 움직인다
