      “그래서 내일까지 고객에게 안부전화하고 추가적인 약속을 잡아보는 데 힘을 써보시지요.”
      처럼 실제 움직임으로 연결되는 표현을 함께 정리해주는 것이 중요합니다.

      이 성향은 원래 조직의 분위기와 유지력을 매우 좋게 만드는 성향입니다. 여기에 밝은 반응과 편안한 분위기가 더해지면 조직의 활동량과 생산성, 매출 흐름도 훨씬 안정적으로 올라가게 됩니다.
