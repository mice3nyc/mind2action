# M2A 심화코칭 — [규칙] 저성향(0~10점) 5세트
# 출처: docs/simhwa/source/고정블록대장.md §3 (지침 §6 확정).
# 어느 위치든 해당 트레잇이 0~10점이면 이 세트를 삽입한다.
#   menu    = 지침의 추상 행동 메뉴(짧은 동사형, prefix)
#   mentions = 샘플에서 실제 실현된 멘트/문장(복붙 가능)
# 각 값은 줄 단위 — 렌더러에서 줄바꿈으로 분리.

low:
  CP:
    label: 기준·결단
    menu: |
      결론 먼저 말하기
      방향 제시하기
      선택기준 제시하기
      마지막에는 반드시 추천하기
    mentions: |
      "지금까지 상담한 내용을 종합해 보면 고객님께는 이 방향이 가장 적합합니다."
      "제가 고객님이라면 이 상품으로 준비하겠습니다."
      "오늘은 고객님께 가장 좋은 선택을 자신 있게 권해드리고 싶습니다."
  NP:
    label: 배려·공감
    menu: |
      공감 먼저 하기
      고객 감정 인정하기
      고객 말을 끝까지 듣기
      "충분히 이해합니다." 사용하기
    mentions: |
      "그 부분이 가장 걱정되셨군요."
      "충분히 그렇게 생각하실 수 있습니다."
      "그 마음 이해됩니다."
      (순서 습관: ① 고객의 말을 끝까지 듣는다 → ② 감정을 먼저 인정한다 → ③ 해결방법을 설명한다)
  A:
    label: 이성·판단
    menu: |
      이유 설명하기
      비교 설명하기
      숫자 활용하기
      근거 설명하기
    mentions: |
      ① 이유: "고객님께 이 보장을 추천드리는 이유는 세 가지입니다."
      ② 비교: "현재 가입하신 보험과 비교하면 가장 큰 차이는 이 부분입니다."
      ③ 근거/숫자: "예를 들어 같은 보험료라도 보장금액은 이렇게 차이가 납니다."
      ④ 결론: "그래서 고객님께는 이 준비가 가장 적합합니다."
  FC:
    label: 친화·표현
    menu: |
      미소를 많이 짓기
      고개 끄덕이기
      리액션 크게 하기
      밝은 목소리 사용
      고객 이름 자주 불러주기
    mentions: |
      미소 짓기
      고객 이름 자주 불러드리기
      고개 끄덕이며 경청하기
      좋은 질문에는 긍정적인 리액션 보이기
      ("좋은 질문입니다.", "맞습니다.", "충분히 그럴 수 있습니다." 리액션 사용)
  AC:
    label: 협조·조율
    menu: |
      부담 여부 묻기
      질문 유도하기
      이해 여부 확인하기
      결정을 재촉하지 않기
    mentions: |
      "고객님, 혹시 제가 조금 빠르게 설명드린 부분은 없었을까요?"
      "궁금하시거나 부담되시는 부분은 편하게 말씀해 주세요."
      "고객님께서 충분히 이해하신 후 결정하셔도 괜찮습니다."
      "제가 설명드린 내용 중 가장 궁금하신 부분은 무엇이실까요?"
      "혹시 아직 결정하시기 어려운 이유가 있으실까요?"
      "고객님께서 이해하신 내용을 함께 다시 한번 정리해 드리겠습니다."

# ── 화법 스왑 규칙 (블록 #10 보조) ──────────────────────────
# A가 낮으면(0~10) 유형별 화법 풀에 아래 '이유 강조' 라인을 삽입/스왑.
talk_swap:
  low_a_line: '"추천드리는 이유를 쉽게 하나씩 차근차근 설명드리겠습니다."'
  # 적용: A가 낮은 사람은 NP·CP·FC 화법 풀에서 한 줄을 위 라인으로 교체(이유 강조).
  #   실측: NP 화법 4번 라인("보험을 권하는 것이 아니라…") → 저A 사람은 위 라인으로 교체.
