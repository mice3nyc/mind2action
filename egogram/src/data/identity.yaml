# 인물상 (top1_top2 20조합, 직군 공통) — 리포트 §1·§2 첫 정의 "OOO님은 ___한 분"
# 원본: 에고그램 인물상 20조합 검토 요청 - 손소장.md (9 기존 + 11 신규, 손소장 26.0611 승인)
# CP=기준·결단 / NP=배려·공감 / A=이성·판단 / FC=친화·표현 / AC=협조·조율

CP_NP:
  title: 기준이 또렷하면서도 사람을 먼저 챙기는 분
  desc: 무엇이 맞는지 분명히 말해 방향을 잡아 주고, 동시에 상대의 마음을 살펴 안심시킵니다. 단단함과 따뜻함을 함께 가졌습니다.
CP_A:
  title: 기준과 분석이 함께 단단한 분
  desc: 원칙이 또렷하고 판단이 냉철해, 복잡한 상황에서도 흔들리지 않고 방향을 제시합니다.
CP_FC:
  title: 분명한 기준을 밝은 기운으로 전하는 분
  desc: 무엇이 맞는지 또렷하게 짚어 주면서도, 그 말이 딱딱하지 않고 밝은 힘으로 전해집니다. 그래서 곁에 있으면 방향이 분명한데도 부담스럽지 않습니다.
CP_AC:
  title: 분명한 기준을 갖되 상대에 맞춰 조율하는 분
  desc: 결정의 중심은 또렷한데, 밀어붙이기보다 상황과 상대를 살펴 속도를 맞춥니다. 신뢰를 주면서도 부담을 주지 않습니다.
NP_CP:
  title: 따뜻하게 품으면서 기준도 분명한 분
  desc: 상대를 먼저 이해하고 보듬되, 필요한 자리에서는 분명한 방향을 짚어 줍니다.
NP_A:
  title: 따뜻하게 공감하면서 차분하게 길을 짚어 주는 분
  desc: 먼저 상대의 마음을 살펴 안심시키고, 그다음 상황을 차분히 정리해 길을 짚어 줍니다. 위로로 그치지 않고 현실적인 방법까지 함께 보여 줍니다.
NP_FC:
  title: 따뜻하게 공감하고 밝게 다가가는 분
  desc: 상대의 마음을 먼저 읽고, 환하고 편안한 분위기로 거리를 좁힙니다. 함께 있으면 마음이 놓이는 사람입니다.
NP_AC:
  title: 깊이 공감하며 세심하게 맞춰 주는 분
  desc: 상대의 감정을 먼저 살피고 조심스럽게 보폭을 맞춥니다. 곁에서 끝까지 함께해 줄 사람이라는 신뢰를 줍니다.
A_CP:
  title: 냉철하게 분석하고 기준이 또렷한 분
  desc: 사실과 흐름을 차분히 정리해 핵심을 짚고, 그 위에 분명한 기준을 세웁니다.
A_NP:
  title: 차분하게 살피면서 마음을 함께 챙기는 분
  desc: 감정에 먼저 휩쓸리지 않고 상황부터 차분히 들여다보되, 상대의 마음이 다치지 않도록 배려하며 길을 보여 줍니다. 흔들리지 않으면서도 따뜻합니다.
A_FC:
  title: 차분하게 판단하면서 분위기를 밝게 살리는 분
  desc: 상황을 차분히 분석해 방향을 또렷하게 잡으면서도, 그 전달이 딱딱하지 않고 밝은 기운을 띱니다. 그래서 곁에 있으면 집중은 또렷해지고 부담은 줄어듭니다.
A_AC:
  title: 차분하게 판단하면서 상황에 맞춰 조율하는 분
  desc: 무엇이 필요한지 차분히 따져 본 뒤, 그 판단을 상대와 조직의 흐름에 맞춰 풀어냅니다. 밀어붙이기보다 상황을 살펴 부드럽게 길을 냅니다.
FC_CP:
  title: 밝은 기운으로 이끌면서 기준도 또렷한 분
  desc: 사람과 분위기를 환하게 살리면서도, 지켜야 할 선과 방향은 분명하게 짚어 줍니다. 즐겁게 따라오게 하면서도 느슨해지지 않게 합니다.
FC_NP:
  title: 밝은 에너지로 다가가 따뜻하게 품는 분
  desc: 먼저 웃으며 다가가 분위기를 열고, 상대의 마음을 따뜻하게 감싸 안습니다.
FC_A:
  title: 밝게 다가가면서 차분하게 판단하는 분
  desc: 환한 기운으로 먼저 다가가 분위기를 열면서도, 정작 판단은 차분하고 또렷합니다. 가볍게 보이지 않고, 밝음 안에 분석의 단단함이 있습니다.
FC_AC:
  title: 밝게 다가가며 상대에 맞춰 함께 걷는 분
  desc: 표정과 말이 밝아 곁에 있으면 긴장이 풀리고, 상대의 반응을 세심하게 살펴 속도를 맞춰 줍니다. 끌고 가기보다 함께 걷는 느낌을 줍니다.
AC_CP:
  title: 상대에 맞춰 조율하되 자기 기준이 또렷한 분
  desc: 상황과 상대를 세심히 살펴 맞추면서도, 중요한 자리에서는 자기 중심을 지킵니다.
AC_NP:
  title: 세심하게 맞추며 먼저 마음을 살피는 분
  desc: 상대의 입장에서 먼저 헤아리고, 분위기를 읽어 갈등이 생기기 전에 부드럽게 풀어 줍니다. 곁에 있으면 지시받는 느낌보다 보호받는 안정감을 느낍니다.
AC_A:
  title: 상대에 맞춰 조율하면서 차분하게 길을 찾는 분
  desc: 상대의 분위기를 섬세하게 살펴 무리하게 밀지 않으면서, 지금 할 수 있는 가장 현실적인 길을 차분히 제시합니다. 흔들리지 않는 안정감을 줍니다.
AC_FC:
  title: 상대를 세심하게 살피며 밝게 기운을 북돋는 분
  desc: 무엇을 부담스러워하는지 빠르게 알아차리고, 무거운 분위기를 웃음과 격려로 풀어 줍니다. 그래서 곁에 있으면 "다시 해 볼 수 있다"는 마음이 듭니다.
