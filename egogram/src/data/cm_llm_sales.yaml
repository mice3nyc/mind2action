# ─── §2 강점 — cm3 (top1_top2 조합키) ────────────────────────────
# PoC 조합키 4개: NP_A · NP_FC · A_CP · CP_NP
# 각 조합키마다 원본 txt에서 추출한 자연스러운 변주 2~3개 배열.
# 개인 사실(이름·경력·소득·실적) 완전 제거, 조합 단위 일반화.
# 강점우선 프레이밍 유지.

cm3:
  NP_A:
    - '고객이 이야기를 꺼내면 끝까지 들어주는 공감과, 복잡한 내용을 한 줄로 정리해 주는 판단력이 함께 작동합니다. 고객 입장에서는 "내 이야기를 충분히 들어줬고, 무엇을 해야 할지도 명확하다"는 두 가지를 동시에 느낍니다. 공감으로 신뢰를 열고 정확한 정리로 결정을 돕는 흐름이 자연스럽게 만들어집니다.'
    - '상대의 감정과 상황을 먼저 이해하는 따뜻함 위에, 핵심을 또렷하게 정리해 주는 분석력이 더해집니다. 설명이 길어지지 않아도 고객은 이해가 됐다는 안정감을 느끼고, 그 안정감이 신뢰로 이어집니다. 공감과 정리가 함께 작동하는 이 구조는 상담이 깊어질수록 더 강해집니다.'
    - '고객을 충분히 이해한 뒤 차분하게 방향을 정리해 주는 성향입니다. 감정에만 머물지 않고 현실적으로 도움이 되는 방법을 제시하기 때문에, 고객은 위로받으면서도 길을 찾게 됩니다. 시간이 지날수록 "힘들 때 생각나는 전문가"로 기억됩니다.'
  NP_FC:
    - '처음 만난 자리에서도 긴장이 자연스럽게 풀립니다. 상대를 편안하게 만드는 따뜻함과, 밝고 생동감 있는 분위기가 함께 작동하기 때문입니다. 고객은 어느새 자신의 이야기를 꺼내고 있고, 상담 시간이 길어도 부담스럽다고 느끼지 않습니다.'
    - '고객의 감정을 빠르게 읽고 공감으로 연결하는 힘 위에, 자연스럽고 밝은 표현이 더해집니다. 어려운 내용도 이야기처럼 쉽게 전달되고, 고객은 "이 사람은 내 이야기를 잘 들어준다"는 느낌을 강하게 받습니다. 상담이 끝난 뒤에도 기분 좋은 기억이 남고, 주변 사람에게 자연스럽게 이야기를 꺼내게 됩니다.'
    - '공감과 밝은 에너지가 함께 있어 고객과의 관계가 빠르게 만들어집니다. 단순히 상품을 들은 것이 아니라 좋은 사람을 만났다는 인상이 남습니다. 신뢰와 편안함이 동시에 쌓이기 때문에 소개가 자연스럽게 이어지는 구조입니다.'
  A_CP:
    - '복잡한 내용을 차분하게 정리해 주는 분석력과, 필요한 순간에 방향을 또렷하게 제시하는 결단력이 함께 작동합니다. 고객은 "이 사람 말이라면 믿고 따라가도 되겠다"는 안정감을 느끼고, 상담이 흐트러지지 않고 결론까지 이어집니다.'
    - '사실과 흐름을 차분하게 정리한 뒤, 그 위에 분명한 기준을 세워 결론을 제시합니다. 듣기 좋은 말보다 도움이 되는 말을 해 주는 사람이라는 인상을 주기 때문에, 시간이 지날수록 신뢰가 깊어지고 고객은 더 의지하게 됩니다.'
  CP_NP:
    - '기준이 분명해서 방향을 잃지 않게 도와주는 힘과, 고객의 마음을 따뜻하게 살피는 배려가 함께 있습니다. 고객은 "나를 제대로 챙겨 줄 사람을 만났다"는 느낌을 자연스럽게 받습니다. 단단함과 따뜻함이 동시에 전해지기 때문에 신뢰가 빠르게 쌓입니다.'
    - '결론을 또렷하게 제시하면서도 고객의 감정을 먼저 살피는 태도가 함께 나타납니다. 원칙이 있지만 그 원칙을 사람을 위해 쓰기 때문에, 고객 입장에서는 압박이 아니라 보호받는 느낌을 받습니다. 시간이 지날수록 "나를 아껴 주면서도 제대로 이끌어 준 사람"으로 기억됩니다.'
    - '밀어주는 힘과 따뜻한 공감이 같이 작동하는 조합입니다. 고객이 망설일 때 방향을 잡아주고, 불안해할 때 곁에서 안심시킵니다. 강한 추진력이 차갑게 느껴지지 않는 이유는 그 안에 진심 어린 배려가 함께 있기 때문입니다.'
