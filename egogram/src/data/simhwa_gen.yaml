    FC: 정기 점검 사이에도 짧고 밝은 연락을 더하십시오. 고객이 편하게 답할 수 있는 안부와 유용한 정보가 반복되면, 공감과 전문성이 일상적인 신뢰로 자리 잡습니다.
    AC: 소개 요청 전 고객의 부담을 확인하고, 소개받는 사람에게도 선택권이 있음을 알려 주십시오. 배려의 원칙을 말로 분명히 하면 고객은 자신의 관계를 안심하고 연결할 수 있습니다.
  NP_FC:
    CP: 관계가 좋다고 소개가 저절로 생기기만 기다리지 마십시오. 편안한 분위기 속에서 “주변에 고민하는 분이 계시면 상담만 연결해 주세요.”라고 요청을 분명하게 말하는 것이 필요합니다.
    A: 누구를 소개하면 좋은지 구체적인 기준을 제시하십시오. 보험 정리가 필요한 사람, 보장 내용을 모르는 사람처럼 대상을 설명하면 고객이 주변 사람을 훨씬 쉽게 떠올릴 수 있습니다.
    AC: 소개 이야기를 꺼내기 전 허락을 구하고, 연결받은 사람에게도 부담을 주지 않겠다는 약속을 분명히 하십시오. {이름} {호칭}의 따뜻함이 관계의 안전까지 보장할 때 소개는 더 편하게 이루어집니다.
  A_CP:
    NP: 정확한 관리에 따뜻한 안부를 더하십시오. 소개를 요청하기 전 고객의 선택과 신뢰에 감사한 마음을 먼저 표현하면, 능력에 대한 신뢰가 사람에 대한 호감으로 이어집니다.
    FC: 점검 연락만 하지 말고 짧고 밝은 접점을 꾸준히 만드십시오. 고객이 {이름} {호칭}을 자주 편안하게 떠올릴수록 “상담을 잘해 주는 사람”이라는 추천도 자연스럽게 나옵니다.
    AC: 소개 대상부터 묻기보다 소개 이야기를 해도 괜찮은지 먼저 확인하십시오. 고객과 소개받는 사람 모두에게 선택권을 보장한다는 말을 더하면 분명한 요청도 부담 없이 전달됩니다.
  A_NP:
    CP: 고객에게 도움이 된 내용을 확인한 뒤 소개를 분명하게 제안하십시오. “같은 고민을 가진 분이 계시면 제가 책임 있게 점검해 드리겠습니다.”라고 말하면 신뢰가 실제 연결로 이어집니다.
    FC: 점검 연락에 따뜻하고 밝은 표현을 더하십시오. 정확한 정보만 전달하기보다 고객의 근황을 묻고 작은 변화에 반응하면 관계의 기억이 살아 있어 소개가 자연스럽습니다.
    AC: 소개 요청 뒤에는 고객이 편하게 선택하도록 여지를 주십시오. 상담만 연결해도 괜찮고 결정은 소개받은 분의 몫이라는 점을 분명히 말하면 부담을 낮출 수 있습니다.
  A_FC:
    CP: 좋은 상담 경험을 소개로 연결하려면 요청을 미루지 마십시오. 점검이 끝난 시점에 “비슷한 고민을 가진 분이 계시면 한번 연결해 주세요.”라고 자연스럽게 행동을 제안하십시오.
    NP: 정보를 전하는 연락에도 고객의 마음과 근황을 먼저 물으십시오. “요즘 가족분들은 어떠세요?”처럼 관심을 보인 뒤 도움이 필요한 사람이 있는지 묻는 것이 좋습니다.
    AC: 소개를 부탁할 때 상담의 부담이 없다는 점을 분명히 하십시오. “결정을 권하는 자리가 아니라 현재 보장만 편하게 확인해 드리겠습니다.”라고 설명하면 고객이 안심하고 연결합니다.
  FC_CP:
    NP: 밝은 친밀감에 진심 어린 감사의 말을 더하십시오. 고객이 자신을 단순한 영업 대상이 아니라 소중한 관계로 느낄 때 소개 요청도 자연스럽게 받아들입니다.
    A: 소개받고 싶은 고객의 상황을 구체적으로 알려 주십시오. 보장 공백, 보험료 부담, 가족 준비처럼 도움의 기준을 설명하면 고객이 적합한 지인을 쉽게 떠올립니다.
    AC: 분명하게 요청한 뒤 고객의 선택을 존중하는 말을 덧붙이십시오. “지금 바로 떠오르지 않으셔도 괜찮습니다.”라고 말하면 밝은 추진력이 부담으로 남지 않습니다.
  FC_NP:
    CP: 소개가 자연스럽게 나오기만 기다리지 말고 편안한 말로 분명히 요청하십시오. “보험으로 고민하는 분이 계시면 상담만 연결해 주세요.”라고 말하면 친근함이 구체적인 행동으로 이어집니다.
    A: 고객이 누구를 떠올려야 하는지 구체적으로 알려 주십시오. 도움이 필요한 상황과 상담에서 제공할 내용을 짧게 설명하면 소개 요청이 막연하지 않고 실용적으로 들립니다.
    AC: 밝은 분위기 속에서도 소개 이야기를 해도 괜찮은지 먼저 물으십시오. 소개받는 사람에게 부담을 주지 않겠다는 약속을 더하면 고객은 관계를 안심하고 연결할 수 있습니다.
  FC_A:
    CP: 상담 만족이 높을 때 소개를 행동으로 제안하십시오. “오늘 설명이 도움이 되셨다면 같은 고민을 가진 분께도 한번 알려 주세요.”라고 분명하게 말하는 것이 좋습니다.
    NP: 유용한 정보만 보내기보다 고객의 생활과 마음을 묻는 안부를 함께 전하십시오. 관계의 온도가 높아질수록 고객은 가까운 사람을 안심하고 연결합니다.
    AC: 소개 상담이 가볍고 부담 없는 자리라는 점을 먼저 설명하십시오. 고객이 연결만 해 주면 이후에는 충분히 듣고 천천히 안내하겠다고 약속하면 신뢰가 높아집니다.
