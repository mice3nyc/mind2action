metadata:
  title: M2A 성향별 심화코칭 생성 문장
  version: v0.2
  scope: AC 억제 규칙을 적용한 전체 12개 비-AC 강점 조합
  combinations:
  - CP_NP
  - CP_A
  - CP_FC
  - NP_CP
  - NP_A
  - NP_FC
  - A_CP
  - A_NP
  - A_FC
  - FC_CP
  - FC_NP
  - FC_A
  retained_from_v0.1:
  - A_CP
  - NP_A
  - NP_FC
  - CP_NP
  - FC_NP
  new_in_v0.2:
  - CP_A
  - CP_FC
  - NP_CP
  - A_NP
  - A_FC
  - FC_CP
  - FC_A
  discarded:
  - AC_NP
  name_placeholder: '{이름} {호칭}'
  customer_keys:
  - CP고객
  - NP고객
  - A고객
  - FC고객
  - AC고객
  notes:
  - 강점 조합키는 CP, NP, A, FC의 순서쌍 12개만 사용
  - AC는 강점으로 세우지 않으며 조율 축에서만 처리
  - v0.1의 유효 5조합 문장은 그대로 유지
  - 각 조합 bottom 3개 변주와 고객유형 5개 문장을 수록
strength:
  CP_NP: '{이름} {호칭}은 CP(기준·결단)의 리드하는 힘과 NP(배려·공감)의 따뜻함을 함께 가진 상담자입니다. 고객의 마음을 살피면서도 필요한 순간에는 기준을 세우고 방향을 제시할 수 있어, 부드럽지만 흐리지 않은 상담을 만듭니다. 고객은 “내 입장을 이해하면서도 책임 있게 이끌어 준다”는 신뢰를 느끼기 쉽습니다. 결정이 필요한 순간에 중심을 잃지 않는다는 점도 큰 장점입니다. 고객을 재촉하지 않으면서도 무엇이 더 중요한지 정리해 주기 때문에, 관계를 지키며 성과까지 연결할 수 있는 균형이 있습니다.'
  CP_A: '{이름} {호칭}은 CP(기준·결단)의 분명한 리더십과 A(이성·판단)의 객관적인 분석력을 함께 가진 상담자입니다. 고객이 무엇을 선택해야 할지 망설일 때 중요한 기준을 먼저 세우고, 왜 그 방향이 필요한지 근거를 들어 설명할 수 있습니다. 고객은 “결론이 분명하다”, “책임 있게 조언해 준다”는 인상을 받기 쉽습니다. 단호한 제안이 개인적인 주장으로 들리지 않고 자료와 비교를 바탕으로 전달된다는 점도 큰 장점입니다. 상담의 흐름을 주도하면서도 고객이 판단할 수 있는 이유를 충분히 보여 주기 때문에, 복잡한 보장을 정리하고 결정을 돕는 상황에서 강점이 더욱 잘 드러납니다.'
  CP_FC: '{이름} {호칭}은 CP(기준·결단)의 추진력과 FC(친화·표현)의 밝은 소통 능력을 함께 가진 상담자입니다. 처음 만난 고객과도 빠르게 대화를 시작하고 분위기를 편안하게 만들면서, 필요한 순간에는 상담의 방향과 추천을 분명하게 제시할 수 있습니다. 고객은 “말하기 편하면서도 믿음이 간다”, “상담을 힘 있게 이끌어 준다”는 인상을 받기 쉽습니다. 친근함이 가벼움으로 흐르지 않고, 결단력이 딱딱함으로 느껴지지 않는 것이 이 조합의 큰 장점입니다. 활기 있는 대화 속에서도 핵심을 놓치지 않기 때문에 고객의 관심을 유지하며 자연스럽게 행동까지 연결할 수 있습니다.'
  NP_CP: '{이름} {호칭}은 NP(배려·공감)의 따뜻한 경청과 CP(기준·결단)의 책임 있는 방향 제시를 함께 가진 상담자입니다. 고객의 걱정과 사정을 충분히 들은 뒤, 그 마음을 고려한 상태에서 무엇을 먼저 준비해야 하는지 분명하게 정리할 수 있습니다. 고객은 “내 입장을 이해해 준다”는 편안함과 “필요한 말은 책임 있게 해 준다”는 신뢰를 동시에 느끼기 쉽습니다. 공감이 상담을 부드럽게 열고 결단력이 상담을 마무리해 주는 구조가 자연스럽습니다. 고객을 몰아붙이지 않으면서도 중요한 결정을 계속 미루지 않도록 이끌 수 있다는 점이 큰 경쟁력입니다.'
  NP_A: '{이름} {호칭}은 NP(배려·공감)의 따뜻함과 A(이성·판단)의 분석력을 함께 가진 상담자입니다. 고객의 이야기를 충분히 듣고 감정을 이해하면서도, 현재 상황을 객관적으로 정리해 실제로 도움이 되는 해답을 제시할 수 있습니다. 고객은 “내 말을 제대로 들어준다”는 편안함과 “설명이 정확하다”는 신뢰를 동시에 느끼기 쉽습니다. 공감이 단순한 위로에서 끝나지 않고 구체적인 해결로 이어진다는 점이 큰 강점입니다. 고객의 걱정을 서두르지 않고 듣되 필요한 정보는 체계적으로 설명하기 때문에, 관계와 내용 가운데 어느 한쪽으로 치우치지 않는 안정된 상담을 만들 수 있습니다.'
  NP_FC: '{이름} {호칭}은 NP(배려·공감)의 따뜻함과 FC(친화·표현)의 밝은 에너지를 함께 가진 상담자입니다. 처음 만난 고객의 긴장을 빠르게 풀어 주고, 자신의 이야기를 편하게 꺼낼 수 있는 분위기를 만드는 데 강점이 있습니다. 고객은 “내 말을 잘 들어준다”, “함께 이야기하기 편하다”는 인상을 자연스럽게 받습니다. 관계를 시작하고 이어 가는 힘이 크다는 점도 중요한 장점입니다. 상담이 딱딱한 상품 설명으로 흐르기보다 사람과 사람 사이의 대화처럼 느껴지기 때문에, 고객 만족도와 재상담, 소개 고객을 만드는 데 유리한 성향입니다.'
  A_CP: '{이름} {호칭}은 A(이성·판단)의 분석력과 CP(기준·결단)의 방향 제시가 함께 강한 상담자입니다. 고객의 현재 보장과 필요를 객관적으로 정리하고, 여러 선택지 가운데 무엇이 더 적합한지 분명한 기준으로 설명할 수 있습니다. 고객은 상담을 받으며 “내용을 정확히 알고 있다”, “결론을 믿고 맡길 수 있다”는 인상을 받기 쉽습니다. 설명이 흔들리지 않고 상담의 흐름도 명확하다는 점이 큰 장점입니다. 복잡한 내용을 핵심부터 정리하고 필요한 순간에는 추천을 분명하게 말하기 때문에, 결정을 오래 미루는 고객에게도 안정감을 줍니다.'
  A_NP: '{이름} {호칭}은 A(이성·판단)의 정확한 분석력과 NP(배려·공감)의 세심한 이해를 함께 가진 상담자입니다. 고객의 현재 보장과 조건을 객관적으로 살피면서도, 그 숫자 뒤에 있는 걱정과 가족 상황까지 놓치지 않고 듣습니다. 고객은 “설명이 명확하다”는 신뢰와 “내 처지를 충분히 고려한다”는 안심을 함께 느끼기 쉽습니다. 자료만 제시하는 차가운 상담도 아니고 공감만 이어지는 막연한 상담도 아닙니다. 고객의 고민을 정확히 정리한 뒤 실제 선택에 도움이 되는 해결책으로 연결할 수 있다는 점이 가장 큰 강점입니다.'
  A_FC: '{이름} {호칭}은 A(이성·판단)의 논리적인 설명력과 FC(친화·표현)의 밝고 자연스러운 전달력을 함께 가진 상담자입니다. 복잡한 보험 내용을 순서 있게 정리하면서도 상담 분위기를 무겁게 만들지 않아, 고객이 질문하고 이해하기 쉬운 환경을 만듭니다. 고객은 “내용을 잘 아는 사람”이라는 신뢰와 “어렵지 않게 설명해 주는 사람”이라는 호감을 동시에 느끼기 쉽습니다. 객관적인 비교와 수치를 대화 속에 자연스럽게 녹여낼 수 있다는 점도 큰 장점입니다. 정확성과 친근함이 함께 있어 정보가 많은 상담에서도 고객의 집중을 유지하고 납득을 이끌어 낼 수 있습니다.'
  FC_CP: '{이름} {호칭}은 FC(친화·표현)가 가장 높은 성향으로, 누구와도 빠르게 친밀감을 형성하고 밝고 긍정적인 분위기를 만드는 능력이 매우 뛰어납니다. 고객은 처음 만나는 자리에서도 긴장을 풀고 편안하게 자신의 이야기를 할 수 있으며, 상담 분위기가 자연스럽고 즐겁게 이어지는 것이 큰 장점입니다. 또한 CP(기준·결단)가 높아 단순히 분위기만 좋은 상담이 아니라 고객에게 필요한 방향을 명확하게 제시할 수 있습니다. 밝은 소통 능력과 명확한 방향 제시가 함께 이루어지는 것이 {이름} {호칭}의 가장 큰 경쟁력입니다.'
  FC_NP: '{이름} {호칭}은 FC(친화·표현)의 밝고 열린 분위기와 NP(배려·공감)의 세심함을 함께 가진 상담자입니다. 처음 만난 고객에게도 자연스럽게 다가가 대화를 시작하고, 고객의 말과 감정을 따뜻하게 받아 줄 수 있습니다. 고객은 “이야기하기 편하다”, “내게 관심을 가지고 듣는다”는 좋은 첫인상을 빠르게 갖게 됩니다. 사람 사이의 거리를 줄이고 관계를 오래 이어 가는 힘도 큽니다. 상담 과정이 부담스럽지 않고 긍정적인 경험으로 남기 때문에, 재상담과 고객관리, 소개로 이어질 가능성이 높은 성향 조합입니다.'
  FC_A: '{이름} {호칭}은 FC(친화·표현)의 밝은 에너지와 A(이성·판단)의 체계적인 설명력을 함께 가진 상담자입니다. 고객과 자연스럽게 대화를 시작하고 긴장을 풀어 주면서도, 상품의 차이와 추천 이유를 객관적으로 정리할 수 있습니다. 고객은 “상담이 편하고 이해하기 쉽다”, “밝지만 내용은 정확하다”는 인상을 받기 쉽습니다. 친근한 분위기가 고객의 질문을 끌어내고, 논리적인 설명이 그 질문을 신뢰로 바꾸어 줍니다. 복잡한 이야기를 부담 없이 전달하고 고객이 스스로 납득하도록 돕는 힘이 이 조합의 중요한 장점입니다.'
adjust:
  CP: CP(기준·결단)이 낮으면 고객의 이야기를 충분히 듣고도 마지막 판단을 고객에게만 남겨 두기 쉽습니다. 상담이 편안하게 끝났지만 고객 입장에서는 “그래서 무엇을 선택하는 것이 좋은가”가 선명하지 않을 수 있습니다. 배려를 줄이는 것이 아니라, 충분히 들은 뒤 결론을 책임 있게 정리하는 행동이 필요합니다. 상담 마지막에는 “지금까지 말씀해 주신 내용을 종합하면 고객님께는 이 방향이 가장 적합합니다.”라고 먼저 결론을 말해 보십시오. 이어 “제가 고객님이라면 이 설계로 준비하겠습니다.”처럼 자신의 추천을 한 번은 분명하게 전달하십시오.
  NP: NP(배려·공감)이 낮으면 정확하고 빠른 설명이 오히려 고객의 걱정을 지나치는 말처럼 들릴 수 있습니다. 고객은 답을 듣기 전에 자신의 불안이 이해받았다는 느낌을 먼저 필요로 합니다. 설명을 늦추라는 뜻이 아니라, 해결책 앞에 감정을 인정하는 한 문장을 놓는 습관이 필요합니다. 고객의 말을 끝까지 들은 뒤 “그 부분이 가장 걱정되셨군요.” 또는 “충분히 그렇게 생각하실 수 있습니다.”라고 먼저 말해 보십시오. 그다음 이유와 해결 방법을 설명하면 같은 내용도 훨씬 편안하게 받아들여집니다.
  A: A(이성·판단)이 낮으면 좋은 의도와 경험이 있어도 추천의 이유가 고객에게 충분히 보이지 않을 수 있습니다. “좋으니까 권한다”는 인상보다 고객이 스스로 납득할 수 있도록 판단의 근거를 눈앞에 펼쳐 주는 행동이 필요합니다. 설명은 이유, 비교, 근거와 숫자, 결론의 순서로 정리해 보십시오. “이 보장을 추천드리는 이유는 세 가지입니다.”라고 시작하고, “현재 보험과 비교하면 가장 큰 차이는 이 부분입니다.”라고 구체적으로 짚은 뒤 최종 추천으로 마무리하십시오.
  FC: FC(친화·표현)이 낮으면 상담 내용은 충실해도 표정과 목소리가 진지하게 굳어 고객이 질문하기 어려울 수 있습니다. 밝게 말하라는 막연한 주문보다, 눈에 보이는 작은 행동을 정해 두는 편이 효과적입니다. 고객을 맞을 때 먼저 미소를 보이고, 대화 중 이름을 자연스럽게 불러 주십시오. 고개를 끄덕이며 듣고 “좋은 질문입니다.” 같은 긍정 반응을 의식적으로 더하면 상담의 온도가 올라가고 고객의 말도 더 많이 나옵니다.
  AC: AC(협조·조율)이 낮으면 설명이 끝난 뒤 고객도 충분히 이해했고 동의했을 것이라고 판단하기 쉽습니다. 그러나 고객은 이해하지 못했거나 부담을 느껴도 질문하지 않을 수 있습니다. 설명을 잘하는 것과 고객이 편하게 따라오는 것은 다른 일이므로, 반드시 확인하는 행동이 필요합니다. 상담 중간과 마지막에 “혹시 제가 조금 빠르게 설명드린 부분은 없었을까요?”라고 물어보십시오. “궁금하거나 부담되는 부분은 편하게 말씀해 주세요.”, “충분히 이해하신 후 결정하셔도 괜찮습니다.”라는 말도 고객이 속마음을 꺼낼 수 있는 여지를 만들어 줍니다.
core_section2:
  CP_NP:
    A: 따뜻한 리드에 객관적인 근거를 더하십시오. “이 보장을 추천드리는 이유는 세 가지입니다.”라고 시작해 비교와 숫자를 보여 주면, 확신이 개인 의견이 아니라 신뢰할 수 있는 판단으로 전달됩니다.
    FC: 배려와 결단은 이미 분명합니다. 여기에 미소, 밝은 목소리, 긍정적인 반응을 더하면 고객은 강한 방향 제시도 부담보다 든든함으로 받아들입니다.
    AC: 고객을 이해하고 방향을 제시하는 힘에 확인의 습관을 더하십시오. “제가 정리한 방향이 고객님께도 편하게 느껴지시는지요?”라고 물으면 리드가 일방적인 결정이 아니라 함께 만든 선택이 됩니다.
