      의식해야 발현 되는 성향입니다. 고객의 반응에 크게 흔들리지 않습니다. 자기 기준으로 차분하게 설명하고, 필요하면 직설적으로 말합니다. "지금 상황에는 이 상품이 맞습니다"처럼 간단히 말합니다. 솔직해서 신뢰는 주지만, 예민한 고객에게는 조금은 차갑게 느껴질 수 있습니다. 그래서 조금 더 부드러운 공감과 따뜻한 말투를 의식적으로 추가하면 고객과의 신뢰감이 더 깊어질 수 있습니다.
    - |
      노력해야 발현되는 성향입니다. 남의 시선을 크게 신경 쓰지 않습니다. 고객 눈치를 거의 보지 않고 자기 생각대로 말합니다. "이게 제일 합리적입니다"처럼 단정적인 표현이 많습니다. 자신감은 느껴지지만, 고객이 압박을 느끼는 경우가 발생할 수 있습니다. 그래서 "이 부분은 어떤가요?"  "혹시 다른 의견이나 말씀하고 싶은 점이 있으신가요?" 처럼 고객의 생각을 확인하고 존중하면서 조금 더 부드럽게 조율해 나가면 신뢰감 있는 상담이 됩니다.
