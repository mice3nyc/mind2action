report:
  intro:
    title: 성향 코칭 리포트의 목적
    items:
      - 거울로 얼굴을 보듯이 성향리포트로 나의 성향을 발견할 수 있습니다. 이후 다섯가지의 성향을 조절해서 사용할 수 있습니다.
      - 나를 진심으로 알게 되면 각성과 성찰을 통해 에고상태의 의식적인 조절과 수정을 실천해 나가게 됩니다. 결국 점점 체득화 되고 습관이 바뀌어 원만한 인간관계와 성공적인 비지니스를 달성할 수 있습니다.
      - 특히 비지니스를 하는 사람은 "왜 흔들리는 지"를 알게 하고 "어떻게 다시 중심을 잡을 지"를 스스로 알게 되어 상담을 원하는 방향으로 이끌 수 있고 슬럼프에 빠지는 것을 예방할 수 있습니다.
      - 궁극적으로 인생 전반에 거쳐 지금보다 나은 삶을 영위할 수 있으며 특히 사랑하는 사람들과의 좋은 관계를 잘 유지해 나갈 수 있습니다.
    sub_title: 우수 보험설계사는?
    sub_items:
      - label: 신뢰를 먼저 세워야 합니다.
        text: 보험은 상품이 아니라 약속입니다. 사람이 믿어야 계약이 이어지고, 믿음이 쌓여야 소개가 생깁니다.
      - label: 고객의 상황을 이해해야 합니다.
        text: 내가 하고 싶은 말을 하기보다, 지금 이 사람이 왜 고민하는지 먼저 알아야 길이 보입니다.
      - label: 쉽게 설명할 수 있어야 합니다.
        text: 어려운 말은 전문가의 언어이고, 쉬운 말은 고객의 언어입니다. 이해되면 결정은 빨라집니다.
      - label: 끝까지 책임져야 합니다.
        text: 계약은 시작일 뿐입니다. 보험금 청구, 관리까지 함께할 때 고객은 평생을 맡깁니다.

  closing:
    title: 마지막으로 드리고 싶은 말씀
    paragraphs:
      - "{name}님은 한 가정의 미래를 지키는 사람입니다. 언제 올지 모르는 위험과 질병, 사고 앞에서 누군가가 무너지지 않도록 미리 길을 준비해 두는 일, 그것이 바로 {name}님이 하시는 일입니다. 눈에 보이는 물건이 아닌 약속과 책임을 설명해야 하기에, 지식만으로는 부족하고 사람의 품격과 태도가 함께 필요합니다."
      - "고객은 설명을 듣고 판단하지만, 선택을 할 때는 결국 사람을 믿습니다. 그래서 한마디 말, 한 번의 방문, 작은 배려가 모여 깊은 신뢰가 됩니다. 그리고 그 신뢰 위에서 {name}님은 단순한 상담자가 아니라 가족의 일을 함께 걱정해 주는 든든한 동반자가 됩니다."
      - "계약 이후에도 연락을 받고, 어려움이 생기면 가장 먼저 떠오르는 이름으로 남는 사람. 끝까지 책임지겠다는 마음으로 자리를 지키는 사람. 그런 분들이 있기에 많은 가정이 다시 일어설 힘을 얻습니다."
      - "오늘도 누군가의 내일을 대신 준비하며 묵묵히 걸어가는 {name}님의 수고는 숫자로 다 표현할 수 없습니다. 삶의 불안을 희망으로 바꾸는 고귀한 일을 하는 분들, 진심으로 존경받아 마땅합니다."
    signature:
      name: 손용배 올림
      email: egogram.son@gmail.com

