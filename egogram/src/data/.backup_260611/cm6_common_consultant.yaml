items:
- title: 고객의 실제 심리 해석
  body: "먼저 고객이 “배우자와 상의해 보겠다\"  “조금 더 생각 해 보겠다\"는  거절의 근저에 있는 심리는  계약을 거절하겠다는 말이 아니라 ‘결정을 하기에는 아직 심리적으로 안전하지 않다'는 신호라고 판단하면 됩니다. 고객은 어느정도 이해했고 상품의 필요성도 인식했으며 진짜 심리는 “안하겠다\"가 아니라 “지금 결정할 마음이 아직 아니다\" 인 경우가 많습니다.  이때 컨설턴트의 역할은 설득자이기 보다는  결정을 가능하게 만드는 조율자가 되야 합니다. \n이 단계에서 고객의 문제는 이해부족이 아니라 결정불안이니 절대로 설득과 결론을 밀지 말아야 합니다."
- title: 재질문 및 재결정 유도
  body: "먼저 고객이 어디까지 결정했고 무엇이 남아 있는지 질문을 통해서 알아봐야 합니다.\n “이 보장의 필요성은 어느정도 공감이  되셨는지요?\" \n “망설여지는 진짜 이유는 무엇일까요?” “보장내용 때문일까요? 아니면 보험료 때문일까요?”\n “그럼 핵심만 정리한 내용을 하나 드릴게요 이걸 보시고  판단을 해보시지요\"\n가장 잘못된 대응은 “상의해 보시고 연락주세요\" “ 그럼 생각해 보시고 연락주세요\" 이 말은 바로 계약 이탈로 연결이 되니 사용하지 않도록 주의 하시기 바랍니다."
