cm1:
  17-20:
    CP: 주장이 강함, 단호함, 책임감 강함, 밀어붙임, 기준과 통제가 높음.
    NP: 탁월한 공감능력, 강한 배려심, 보호본능, 신뢰형성
    A: 강한 분석력과 판단력, 명확성, 객관성, 높은 이성
    FC: 아주 밝음, 활발함, 표현 풍부, 친근함, 에너지, 다소 가벼움
    AC: 순응, 눈치, 조심, 맞춤형, 불안.
  14-16:
    CP: 결정력 있음, 믿음직한, 판단이 빠름, 기준과 통제가 있음.
    NP: 공감 잘함, 배려 깊음, 따뜻함, 신뢰감 있음, 안정적.
    A: 이성적, 균형감, 현실적, 분석적.
    FC: 밝음, 친화력, 유연함, 편안함, 자연스러움.
    AC: 협조, 적당한 순응, 적당한 눈치, 조율.
  11-13:
    CP: 균형감 있는 결정력, 유연한 기준과 통제, 보통의 주장성.
    NP: 적당한 친절, 예의 바름, 부담 없음.
    A: 평균적 분석, 보통의 현실감각, 보통의 이성과 상황 판단.
    FC: 안정감, 차분한, 균형감, 무난함.
    AC: 적응력, 균형감, 무난함, 순응과 직설의 중용.
  8-10:
    CP: 완화된 결정력과 주장성, 조금 망설임, 조율함.
    NP: 차분함, 무심해 보임, 실무형, 표현 적음.
    A: 감정이 우선, 계산이 다소 약함, 판단이 조금 흔들림.
    FC: 조용함, 신중함, 진지함, 다소 거리감
    AC: 독립적, 솔직함, 직설적, 자기 기준.
  0-7:
    CP: 우유부단, 착함,  결정 어려움, 말을 아낌.
    NP: 무뚝뚝함, 공감 부족, 차갑게 보임.
    A: 감정 몰임, 즉각 반응, 예술적, 판단과 논리가 조금 부족 .
    FC: 무표정, 감정 절제, 경직됨, 딱딱함.
    AC: 단호함, 직선적, 눈치 안 봄, 상대를 통제.
cm2:
  17-20:
    CP: 기준과 원칙이 아주 분명합니다. 상담 자리에서 말과 자세가 단정하고 자신감이 있습니다. “이 부분은 꼭 필요합니다”, “이 선택이 가장 안전합니다”처럼 단호하게 말합니다. 고객이 망설이면 방향을 잡아 주려는 마음이 강합니다. 다만 너무 확신에 찬 말투 때문에 고객이 압박을 느낄 수 있습니다.
    NP: 고객을 향한 마음의 온도가 매우 높습니다. 고객의 말을 들으면 먼저 이해하려 하고, 판단보다 공감을 앞세웁니다. 그래서 고객은 이분과 상담할 때 편안함을 느끼고, 자신의 이야기를 솔직하게 꺼내도 괜찮겠다는 신뢰를 갖게 됩니다. 힘든 상황에서도 끝까지 함께해 줄 사람이라는 확신을 주는, 관계의 기반을 만드는 따뜻한 힘이 있습니다.
    A: 고객 상담에서 감정에 치우치지 않고 사실과 흐름을 차분히 정리하는 능력이 뛰어납니다. 복잡한 조건 속에서도 핵심을 잡아 주기 때문에 고객은 방향을 잃지 않습니다. 설명은 명확하고 판단은 균형 잡혀 있어, 고객에게 안정감과 전문성을 동시에 느끼게 합니다. 믿고 맡길 수 있는 사람이라는 확신을 만드는 힘입니다.
    FC: 사람을 만나는 걸 정말 즐깁니다. 상담할 때 표정이 밝고 마음이 열려 있으며, 먼저 웃으며 말을 겁니다. 고객의 이야기에 고개를 끄덕이고 반응이 빠릅니다. 말투는 부드럽고 친근해서 “아, 그런 상황이셨군요”처럼 공감부터 합니다. 다만 분위기가 너무 가벼워 보이면 중요한 설명이 가볍게 느껴질 수 있어 조절이 필요합니다.
    AC: 고객의 표정과 말투를 아주 민감하게 살핍니다. 고객이 불편해할까 봐 먼저 조심하고, 맞춰 주는 태도가 강합니다. 말할 때도 “괜찮으시면요”, “부담되시면 안 하셔도 돼요” 같은 표현을 자주 씁니다. 고객의 기분은 잘 읽지만, 본인 의견을 끝까지 말하지 못해 설명이 흐려질 수 있습니다.
  14-16:
    CP: 책임감 있고 믿음직한 태도를 보입니다. 상담할 때 흐트러짐 없이 차분하게 설명하고, 중요한 포인트를 분명히 짚어 줍니다. 말투는 또렷하지만 공격적이지 않고 “이 기준으로 보시면 이해가 쉬워요”처럼 안내합니다. 고객은 이 성향의 컨섵턴트를 통해 안정감과 신뢰를 느끼기 쉽습니다.
    NP: 따뜻하면서도 안정감 있게 고객을 대합니다. 고객의 이야기를 잘 들어주고 고개를 끄덕이며 공감해 줍니다. 말투는 부드럽고 “그렇게 느끼실 수 있어요”, “많이 고민되셨죠” 같은 표현을 자연스럽게 씁니다. 필요할 때는 조심스럽게 방향을 제시해 고객이 혼자 결정한다고 느끼게 해줍니다. 신뢰받기 쉬운 태도입니다.
    A: 감정보다 이성과 논리로 상담합니다. 고객의 이야기를 차분히 듣고, 필요한 정보만 골라 쉽게 제안합니다. “걱정되실 수 있어요. 그래서 이 상황에서는 이렇게 해 봅시다”처럼 짧게 공감을 한 후에 코칭을 합니다. 말투가 안정적이고 판단이 흔들리지 않아 고객이 신뢰하기 쉽습니다. 가장 이상적인 상담 태도입니다.
    FC: 편안한 분위기를 자연스럽게 만듭니다. 자세는 안정적이고 표정도 부드러워 고객이 긴장을 풀기 쉽습니다. 말할 때는 웃음과 공감을 섞어 “편하게 생각하셔도 됩니다”라고 말합니다. 분위기는 밝고 과하지 않아 상담이 편안합니다.
    AC: 상황을 보며 말을 고르는 편입니다. 고객 반응을 보면서 속도를 조절하고, 무리하게 밀지 않습니다. “이 부분은 고객님 상황에 맞춰 생각해 보셔도 돼요”처럼 부드럽게 말합니다. 배려와 안정감은 주지만, 결정이 늦어질 수 있습니다.
  11-13:
    CP: 상황에 맞게 유연하게 대응합니다. 자기 의견도 있지만 고객 말도 잘 듣습니다. 상담에서는 “제 생각은 이렇지만, 고객님 상황도 중요합니다”처럼 균형 잡힌 말을 합니다. 강하게 밀어붙이지도, 너무 물러서지도 않아 편안한 상담이 됩니다. 고객은 부담 없이 설명을 받아들입니다.
    NP: 고객에게 예의 있게 대하고 필요한 설명을 차분히 합니다. 말은 짧고 정리되어 있으며 “이 부분은 이렇게 보시면 돼요”처럼 담백한 표현을 씁니다. 고객은 부담 없이 설명을 듣는 느낌을 받습니다. 다만 공감하는 표현을 조금만 더 한다면 고객의 만족도는 더 상승합니다.
    A: 상황에 따라 감정과 논리를 오가며 상담합니다. 고객 반응을 보며 설명을 조절하고, 너무 딱딱하지도 너무 감정적이지도 않습니다. “이렇게 생각하실 수 있는데, 현실적으로 보면 이 선택이 좋아요”처럼 말합니다. 무난하지만 결정이 조금 늦어질 수 있어 정리 멘트가 필요합니다.
    FC: 무난하고 차분한 태도를 보입니다. 자세는 바르고 표정은 안정적입니다. 말투는 또렷하지만 감정 표현은 많지 않습니다. “이 부분을 설명드리겠습니다”처럼 설명 중심으로 말합니다. 편하지도 불편하지도 않은 느낌을 주며, 고객은 안정감을 느끼며 “이 분은 전문가 답다"라고 느낌
    AC: 고객 눈치도 보고 자기 생각도 말할 줄 압니다. 분위기가 무겁지 않게 유지하면서도 필요한 설명은 분명히 합니다. “이건 장단점이 있어요. 고객님께 맞는 쪽을 같이 보죠”처럼 균형 잡힌 말투를 씁니다. 고객도 부담 없이 듣습니다.
  8-10:
    CP: 고객을 존중하면서도 자기 생각을 조금씩 말할 수 있습니다. 상담할 때 “제 경험으로 보면 이 방법이 더 안전해요”처럼 조심스럽게 방향을 제시합니다. 고객을 몰아붙이지는 않지만, 완전히 맡기지도 않습니다. 다만 확신이 조금은 약해 보여서 고객이 결정을 미루는 경우가 가끔 생기기도 합니다.
    NP: 배려하는 표현이 다소 적은 편입니다. 고객을 존중하긴 하지만 말수가 많지 않습니다. 상담에서는 설명 위주로 말하며 “이 상품은 이런 구조입니다”처럼 사실 중심으로 이야기합니다. 공감 표현은 적어 다소 차갑게 느껴질 수 있지만, 일은 또렷하게 진행됩니다. 고객에 따라 거리감이 느껴질 수 있습니다.
    A: 상황을 이해하고 판단하려는 노력은 있지만 중요한 결정에서 경험이나 익숙한 방법을 우선 참고하는 경우가 있습니다. 상담 중에도 사실 확인이나 원인 분석보다 다소 감정적인 해석이나 경험 중심의 판단에 의존하는 경우가 있어 문제의 원인과 해결 방법을 한 번 더 정리하는 습관이 필요합니다.
    FC: 조용하고 진지한 모습이 강합니다. 상담 중 말수가 적고 표정 변화도 크지 않습니다. 자세는 단정하지만 다소 굳어 보일 수 있습니다. 말할 때는 필요한 말만 짧게 하며 감정 표현이 거의 없습니다. 고객은 신뢰는 느끼지만 “조금 신중하다”고 느낄 수 있습니다.
    AC: 고객 반응에 크게 흔들리지 않습니다. 자기 기준으로 차분하게 설명하고, 필요하면 직설적으로 말합니다. “지금 상황에는 이 상품이 맞습니다”처럼 간단히 말합니다. 솔직해서 신뢰는 주지만, 예민한 고객에게는 조금은 차갑게 느껴질 수 있습니다.
  0-7:
    CP: 자기 기준을 강하게 내세우지 않습니다. 상담할 때 고객 말을 먼저 듣고, 웬만하면 반대하지 않습니다. “고객님 생각이 맞아요”, “원하시는 대로 하셔도 됩니다”라는 말을 자주 합니다. 분위기는 편하지만, 고객이 “그래서 뭘 선택해야 하지?” 하고 헷갈릴 수 있습니다. 방향을 잡아주는 힘은 약한 편입니다.
    NP: 상대가 느끼기에 다소 차갑게 보일 수 있습니다.  상담할 때도 바로 본론으로 들어가며 “필요한 것만 말씀드리겠습니다”라는 식의 말투를 씁니다. 위로나 공감보다는 정보 전달이 중심입니다. 고객은 정확하다고 느낄 수 있지만, 마음을 이해받는 느낌은 적을 수 있습니다. 친절해 보이지 않는다는 오해를 받을 수 있습니다.
    A: 직관과 경험을 중요하게 생각하는 편입니다. 다만 중요한 판단에서도 사실 확인이나 객관적인 비교가 충분하지 않을 수 있습니다. 고객 상담 시에도 감정적인 판단이나 개인 경험을 사실보다 우선하는 경우가 있어 내용은 자료와 근거를 다시 확인하는 습관이 필요합니다.
    FC: 감정을 거의 드러내지 않습니다. 표정이 굳어 있고 몸도 긴장돼 보일 수 있습니다. 말투는 건조하고 설명 위주이며 공감 표현이 적습니다. 고객이 말을 해도 반응이 적어 “내 말이 전달됐나?”라고 느낄 수 있습니다. 신뢰는 줄 수 있지만 거리감이 커질 가능성이 있습니다.
    AC: 남의 시선을 크게 신경 쓰지 않습니다. 고객 눈치를 거의 보지 않고 자기 생각대로 말합니다. “이게 제일 합리적입니다”처럼 단정적인 표현이 많습니다. 자신감은 느껴지지만, 고객이 압박을 느끼는 경우가 발생할 수 있습니다.
cm3:
  CP_NP: |-
    고객은 이 성향의 컨설턴트를 통해 단단함과 따뜻함을 동시에 느끼게 됩니다. 무엇이 맞는지 분명하게 이야기해 주는 힘이 있어 방향을 잃지 않게 도와주고, 혹시라도 마음이 불안해지면 옆에서 손을 잡아 주듯 안정감을 줍니다. 그래서 고객은 “나를 제대로 챙겨 줄 사람을 만났다”는 느낌을 자연스럽게 받습니다.

    기준이 있다는 것은 전문가라는 뜻입니다.
    하지만 그 기준을 사람을 위해 사용한다는 점이 더 큰 감동을 만듭니다. 고객의 상황을 듣고, 이해하고, 무리한 선택을 막아 주며, 필요한 부분을 책임 있게 정리해 줍니다. 이 모습은 신뢰를 만들고, 신뢰는 결국 관계를 오래가게 합니다.

    시간이 지날수록 고객의 마음속에서는 이런 생각이 자랍니다.
    “이 사람은 나에게 팔려고 하기보다 도와 주려고 한다.”

    보험은 계약보다 사람이 남는 일입니다.
    그리고 이 성향의 컨섵턴트는 사람을 남기는 힘이 매우 큽니다.

    앞으로의 성장 가능성은 분명합니다.
    원칙이 흔들리지 않기 때문에 실수로 무너지지 않고, 따뜻함이 있기 때문에 고객이 떠나지 않습니다. 단단한 뿌리와 넓은 그늘을 함께 가진 나무처럼, 시간이 흐를수록 더 많은 사람이 찾게 될 것입니다.

    이미 좋은 컨설턴트의 길 위에 서 있습니다.
    그리고 앞으로는 더 많은 사람이 그 가치를 알아보게 될 것입니다.
  CP_A: |-
    상담 자리에 앉는 순간 고객은 묘한 안정감을 느낍니다. 말의 기준이 분명하고, 설명에는 흔들림이 없습니다. 감정에 휩쓸리기보다 사실을 바탕으로 또박또박 정리해 주기 때문에 고객은 복잡했던 생각이 차분하게 정돈됩니다. 무엇을 선택해야 할지 몰라 답답했던 마음이 “이제 알겠다”로 바뀌는 경험을 하게 됩니다.

    이 성향의 컨설턴트는 강한 책임감을 바탕으로 움직입니다. 맞는 것은 맞다고, 아닌 것은 아니라고 이야기해 주는 힘이 있습니다. 그런데 그것이 차갑게 들리지 않는 이유는 판단이 공정하고 근거가 분명하기 때문입니다. 고객은 압박을 받는 느낌이 아니라 보호받는 느낌을 받습니다.

    상담이 끝날 즈음이면 고객의 머릿속에는 이런 생각이 남습니다.
    “나에게 팔려고 온 사람이 아니라, 제대로 판단하게 도와주는 전문가구나.”

    보험은 결국 신뢰가 쌓여야 이어지는 일입니다. 이 성향의 컨섵턴트는 말을 많이 하지 않아도 믿음이 쌓이는 구조를 이미 가지고 있습니다. 시간이 지날수록 고객은 더 의지하게 되고, 소개와 재계약으로 관계는 넓어집니다.

    앞으로의 성장 가능성은 매우 큽니다. 기준이 단단하기 때문에 방향을 잃지 않고, 이성적인 판단이 받쳐 주기 때문에 큰 실수를 줄일 수 있습니다. 한 번 신뢰를 얻으면 오래 가는 상담을 만들어 내는 힘, 그것이 가장 큰 자산입니다.

    지금도 충분히 잘하고 있습니다.
    그리고 경험이 더해질수록 무게감 있는 전문가로 기억될 것입니다.
  CP_FC: |-
    이 성향의 컨설턴트는 고객을 만나는 순간부터 분위기가 단번에 살아납니다. 기준과 원칙은 분명하게 세워 두면서도, 표정이 밝고 생기가 흐르기 때문입니다. 해야 할 말은 또렷하게 전달하고, 동시에 상대가 편안하게 웃을 수 있는 여유도 있습니다. 그래서 상담 시간이 부담이 아니라 즐거운 만남처럼 느껴집니다.

    이 성향의 힘은 신뢰와 친밀함을 동시에 만든다는 점입니다. 한쪽만 있으면 부족해질 수 있지만, 두 가지가 함께 움직이니 고객의 마음은 빠르게 열립니다. 설명을 들을수록 “이 사람은 믿을 수 있다”는 생각이 들고, 함께 이야기할수록 “또 만나고 싶다”는 마음이 생깁니다.

    상담이 끝나면 고객의 기억 속에는 이런 느낌이 남습니다.
    “원칙이 분명한데도 불편하지 않고, 오히려 기분 좋게 결정하게 해 준 사람.”

    보험은 결국 사람의 마음을 얻는 일입니다. 즐거움 속에서 신뢰를 만들 수 있다면, 관계는 오래 갑니다. 시간이 갈수록 소개가 늘어나고, 고객은 자연스럽게 주변 사람에게 이 성향의 컨섵턴트 이야기를 꺼내게 됩니다.

    앞으로의 성장 가능성은 더욱 기대됩니다. 기준이 중심을 잡아 주고, 밝은 에너지가 사람을 끌어당기기 때문입니다. 경험이 더해질수록 만남 하나하나가 팬을 만드는 시간이 될 것입니다.

    지금의 모습 자체가 이미 큰 경쟁력입니다.
    그리고 앞으로는 사람을 모으는 전문가로 더 또렷하게 빛나게 될 것입니다.
  CP_AC: |-
    고객은 이 성향의 컨설턴트를 통해 묘하게 안심이 됩니다. 왜냐하면 기준이 분명하기 때문입니다. 해야 할 말과 하지 말아야 할 말을 구분하고, 도움이 되는 방향을 또렷하게 제시합니다. 그래서 고객은 생각합니다.
    “이 사람은 흔들리지 않는 전문가구나.”

    그런데 여기에 한 가지 힘이 더 있습니다. 상대의 입장과 분위기를 빠르게 읽고 맞추는 능력입니다. 고객이 조심스러워하면 속도를 낮추고, 고민이 많아 보이면 충분히 기다려 줍니다. 강하게 밀어붙이기보다 편안하게 결정할 수 있는 환경을 만들어 줍니다.

    원칙은 단단하지만 태도는 부드럽습니다.
    그래서 고객은 부담보다 신뢰를 먼저 느낍니다.

    이 성향의 컨설턴트는 시간이 지날수록 더 큰 힘을 냅니다.
    기준이 있으니 실수가 적고, 배려가 있으니 사람이 남습니다.
    결국 계약은 관계 위에서 반복됩니다.

    앞으로의 성장 가능성은 분명합니다.
    신뢰를 주는 리더십과 상황에 맞추는 감각이 함께 있기 때문입니다. 고객은 이런 사람에게 가족을 맡기고, 지인을 소개합니다.

    계속 이렇게만 가시면 됩니다.
    이미 좋은 전문가의 길 위에 올라와 있습니다.
  NP_CP: |-
    고객은 이 성향의 컨설턴트를 만나는 순간부터 따뜻함을 느끼게 됩니다. 말투에는 배려가 담겨 있고, 표정에는 상대를 진심으로 도와주고 싶다는 마음이 보입니다. 그래서 처음 보는 사람도 경계하기보다 편안함을 느끼게 됩니다. 그런데 이 부드러움 속에는 분명한 기준과 방향이 함께 자리 잡고 있습니다. 필요한 부분에서는 또렷하게 정리해 주고, 무엇이 고객에게 더 안전하고 유리한 선택인지 확신 있게 안내합니다.

    이 성향의 힘은 마음을 열게 만드는 친절함과 결정을 돕는 단단함이 동시에 존재한다는 데 있습니다. 고객은 이야기를 나누면서 “정말 나를 생각해 주는구나”라는 감동을 받고, 설명을 들을수록 “그래서 믿고 맡길 수 있겠다”라는 확신을 가지게 됩니다.

    상담이 끝난 뒤 고객의 마음속에는 이런 생각이 남습니다.
    “나를 아껴 주면서도 제대로 이끌어 준 사람.”

    보험은 상품을 파는 일이 아니라 사람의 삶을 책임지는 일입니다. 상대를 품는 따뜻함 위에 분명한 기준이 세워져 있으니, 시간이 지날수록 신뢰는 더 깊어집니다. 그 신뢰는 다시 소개로 이어지고, 소개는 또 다른 만남을 부릅니다.

    앞으로의 성장 가능성은 매우 큽니다. 이미 사람의 마음을 얻는 방법을 알고 있고, 그 마음 위에 올바른 방향까지 제시할 수 있기 때문입니다. 경험이 쌓일수록 주변에는 도움받았다고 말하는 사람들이 계속 늘어나게 될 것입니다.

    지금도 충분히 훌륭합니다.
    그리고 앞으로는 고객의 인생에 오래 기억되는 이름으로 남게 될 것입니다.
  NP_A: |-
    고객이 이 성향의 컨설턴트를 통해 가장 먼저 느껴지는 것은 따뜻함입니다. 상대의 이야기를 끊지 않고 끝까지 들으며, 무엇이 힘들고 무엇이 필요한지를 세심하게 살핍니다. 그래서 고객은 자연스럽게 마음을 열고 속마음까지 이야기하게 됩니다. 그런데 여기서 끝나지 않습니다. 충분히 공감한 뒤에는 감정에만 머물지 않고, 상황을 차분히 정리하여 현실적으로 도움이 되는 방법을 제시합니다.

    이 성향의 큰 힘은 배려와 판단이 함께 움직인다는 점입니다. 고객은 “내 마음을 이해해 준다”는 안정감을 느끼면서도 동시에 “그래서 무엇을 하면 좋을지 명확하다”는 신뢰를 갖게 됩니다. 따뜻한데도 흔들리지 않고, 친절한데도 결정이 분명하니 상담의 밀도가 높아집니다.

    상담이 끝나고 나면 고객의 마음속에는 이런 생각이 남습니다.
    “나를 위로해 주면서도 길을 알려준 사람.”

    보험은 복잡하고 어렵게 느껴질 수 있지만, 이 조합을 가진 사람을 만나면 이해가 쉬워집니다. 말이 과장되지 않고, 필요한 이유를 납득하게 만들기 때문입니다. 그래서 시간이 흐를수록 관계는 더 단단해지고, 고객은 주변 사람에게 자신 있게 소개하게 됩니다.

    앞으로의 성장 가능성 역시 매우 밝습니다. 이미 사람을 품는 힘이 있고, 그 위에 정확한 판단을 더할 수 있기 때문입니다. 경험이 늘어날수록 상담의 깊이는 더욱 커지고, 신뢰는 오래 유지될 것입니다.

    결국 고객에게 이렇게 기억됩니다.
    “힘들 때 생각나는 전문가.”
  NP_FC: |-
    고객은 이 성향의 컨설턴트를 만나는 순간 분위기가 부드러지는 것을 느낍니다. 상대를 편안하게 해주는 따뜻함이 먼저 전해지고, 이어서 밝은 에너지가 공간을 환하게 만듭니다. 그래서 처음 만난 사람도 금방 긴장을 풀고 웃게 됩니다. 보험 이야기는 딱딱할 수 있지만, 이 성향을 가진 사람의 설명은 부담이 적고 자연스럽게 들립니다.

