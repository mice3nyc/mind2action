cm8:
  CP:
    encourage: |-
      리더의 첫 번째 책임은 현실을 정의하는 것이다.
      — 맥스 드프리, "Leadership Is an Art"
    improve: |-
      사람들은 당신이 얼마나 관심을 갖는지 알기 전까지, 당신이 얼마나 아는지에 관심 없다.
      — 시어도어 루스벨트
  NP:
    encourage: |-
      관심을 기울이는 것은 가장 희귀하고 순수한 형태의 관대함이다.
      — 시몬 베유
    improve: |-
      명확한 것이 친절한 것이다. 불명확한 것이 불친절한 것이다.
      — 브레네 브라운, "Dare to Lead"
  A:
    encourage: |-
      간단하게 설명할 수 없으면, 충분히 이해한 것이 아니다.
      — 알베르트 아인슈타인
    improve: |-
      사람들은 당신이 한 말은 잊어도, 당신이 느끼게 한 감정은 잊지 않는다.
      — 마야 안젤루
  FC:
    encourage: |-
      열의 없이 위대한 것이 성취된 적은 없다.
      — 랄프 왈도 에머슨
    improve: |-
      자유란 책임을 의미한다. 그래서 대부분의 사람들이 자유를 두려워한다.
      — 조지 버나드 쇼
  AC:
    encourage: |-
      세상에서 가장 부드러운 것이 세상에서 가장 단단한 것을 이긴다.
      — 노자, 도덕경 43장
    improve: |-
      내가 나를 위하지 않으면, 누가 나를 위하겠는가.
      — 힐렐, 탈무드 피르케이 아보트
